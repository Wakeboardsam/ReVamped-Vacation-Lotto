<script>
  // State
  var appState = {
    participantId: null,
    name: null,
    activeYear: null,
    phase: null,
    round: null,
    direction: null,
    isActive: false,
    participant: null,
    availableChoices: null,
    selections: [],
    adjacentHolidayPending: null
  };

  // Public Display State
  var publicDisplayState = {
    snapshot: null,
    selectedPerson: '',
    loaded: false,
    loading: false,
    refreshPending: false,
    refreshTimerId: null
  };

  // Utility to show toasts
  function showToast(message, type) {
    type = type || 'error';
    var container = document.getElementById('toastContainer');
    var toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.innerText = message;
    container.appendChild(toast);
    setTimeout(function() {
      if (toast.parentNode) {
        toast.parentNode.removeChild(toast);
      }
    }, 5000);
  }

  // Set login loading state
  function setLoginLoading(isLoading) {
    var btn = document.getElementById('loginBtn');
    if (isLoading) {
      btn.innerText = "Logging in...";
      btn.disabled = true;
    } else {
      btn.innerText = "Log In";
      btn.disabled = false;
    }
  }

  // Initialization
  document.addEventListener("DOMContentLoaded", function() {
    // Check local storage for session
    var savedName = localStorage.getItem('lotto_user');

    if (savedName) {
      appState.participantId = savedName;
      appState.name = savedName;
      showMainScreen();
    } else {
      document.getElementById('loginScreen').classList.add('active');
      loadPublicDisplay();
    }

    // Background refresh timer
    if (!publicDisplayState.refreshTimerId) {
      publicDisplayState.refreshTimerId = setInterval(function() {
        if (document.visibilityState === 'visible' && document.getElementById('loginScreen').classList.contains('active')) {
          if (!publicDisplayState.loading) {
            loadPublicDisplay();
          }
        }
      }, 60000);
    }

    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible' && document.getElementById('loginScreen').classList.contains('active')) {
        if (!publicDisplayState.loading) {
          loadPublicDisplay();
        }
      }
    });

    var findPersonSelect = document.getElementById('findPersonSelect');
    if (findPersonSelect) {
      findPersonSelect.addEventListener('change', function() {
        publicDisplayState.selectedPerson = this.value;
        applyFindPersonHighlights();
      });
    }

    var clearPersonBtn = document.getElementById('clearPersonBtn');
    if (clearPersonBtn) {
      clearPersonBtn.addEventListener('click', function() {
        if (findPersonSelect) findPersonSelect.value = '';
        publicDisplayState.selectedPerson = '';
        applyFindPersonHighlights();
      });
    }

    // Event Listeners
    document.getElementById('loginBtn').addEventListener('click', handleLogin);
    document.getElementById('logoutBtn').addEventListener('click', handleLogout);
    document.getElementById('rulesBtn').addEventListener('click', function() {
      document.getElementById('infoModal').style.display = 'flex';
    });
    document.getElementById('closeInfoBtn').addEventListener('click', function() {
      document.getElementById('infoModal').style.display = 'none';
    });

    // Segmented toggle listeners
    document.querySelectorAll('input[name="volunteerChoice"]').forEach(function(radio) {
      radio.addEventListener('change', checkRulesForm);
    });
    document.querySelectorAll('input[name="transferPrefRadio"]').forEach(function(radio) {
      radio.addEventListener('change', checkRulesForm);
    });

    document.getElementById('saveRulesBtn').addEventListener('click', saveRules);

    document.getElementById('submitSelectionBtn').addEventListener('click', submitSelection);
    document.getElementById('passBtn').addEventListener('click', function() {
      submitSelection(true); // isPass = true
    });

    document.getElementById('confirmHolidayBtn').addEventListener('click', confirmHolidaySelection);
    document.getElementById('declineHolidayBtn').addEventListener('click', declineHolidaySelection);
    document.getElementById('cancelWeekendBtn').addEventListener('click', function() {
      document.getElementById('holidayPromptModal').style.display = 'none';
      appState.adjacentHolidayPending = null;
    });
  });

  // Login
  function handleLogin() {
    var name = document.getElementById('loginName').value;
    var pin = document.getElementById('loginPin').value;
    var errorDiv = document.getElementById('loginError');

    if (!name || !pin) {
      errorDiv.innerText = "Please enter both name and PIN.";
      errorDiv.style.display = 'block';
      return;
    }

    setLoginLoading(true);
    errorDiv.style.display = 'none';

    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || typeof res !== 'object') {
          setLoginLoading(false);
          showToast("Invalid response from server.");
          return;
        }
        if (res.success !== true) {
          setLoginLoading(false);
          showToast(res.error || "Login failed");
        } else if (!res.participantName) {
          setLoginLoading(false);
          showToast("Missing participant name in response.");
        } else {
          localStorage.setItem('lotto_user', res.participantName);
          appState.participantId = res.participantName;
          appState.name = res.participantName;
          document.getElementById('loginScreen').classList.remove('active');
          document.getElementById('mainScreen').style.display = 'block';
          fetchInitialState(res.participantName);
        }
      })
      .withFailureHandler(function(err) {
        setLoginLoading(false);
        var errMsg = "Connection error. Please try again.";
        if (err && err.message) errMsg += " (" + err.message + ")";
        else if (typeof err === 'string') errMsg += " (" + err + ")";
        alert(errMsg);
      })
      .authenticateParticipant(name, pin);
  }

  function handleLogout() {
    localStorage.removeItem('lotto_user');
    appState.participantId = null;
    document.getElementById('mainScreen').style.display = 'none';
    document.getElementById('loginScreen').classList.add('active');
    document.getElementById('loginName').value = '';
    document.getElementById('loginPin').value = '';
    setLoginLoading(false);
    loadPublicDisplay(true); // Forced refresh on logout
  }

  // Main Screen & Data Loading
  function showMainScreen() {
    document.getElementById('loginScreen').classList.remove('active');
    document.getElementById('mainScreen').style.display = 'block';
    fetchInitialState(appState.participantId);
  }

  function onStateLoaded(state) {
    // 1. Defend against null, undefined, string, or non-object payload
    if (!state || typeof state !== 'object') {
      localStorage.removeItem('lotto_user');
      setLoginLoading(false);
      document.getElementById('mainScreen').style.display = 'none';
      document.getElementById('loginScreen').classList.add('active');
      showToast("Received invalid response from server.");
      document.getElementById('loadingIndicator').style.display = 'none';
      loadPublicDisplay(); // ensure public display is loaded
      return;
    }

    // 2. Check explicitly for server-reported failure
    if (state.success !== true) {
      localStorage.removeItem('lotto_user');
      setLoginLoading(false);
      document.getElementById('mainScreen').style.display = 'none';
      document.getElementById('loginScreen').classList.add('active');
      showToast(state.error || "Session invalid");
      document.getElementById('loadingIndicator').style.display = 'none';
      loadPublicDisplay(); // ensure public display is loaded
      return;
    }

    // 3. Ensure required data structure exists before accessing deeply
    if (!state.participant || !state.availableChoices) {
      localStorage.removeItem('lotto_user');
      setLoginLoading(false);
      document.getElementById('mainScreen').style.display = 'none';
      document.getElementById('loginScreen').classList.add('active');
      showToast("Malformed state response from server.");
      document.getElementById('loadingIndicator').style.display = 'none';
      loadPublicDisplay(); // ensure public display is loaded
      return;
    }

    try {
      appState.activeYear = state.activeYear;
      appState.phase = state.phase;
      appState.round = state.round;
      appState.direction = state.direction;
      appState.isActive = state.isActive;
      appState.participant = state.participant;
      appState.availableChoices = state.availableChoices;

      updateHeader();
      checkRulesAcknowledgment();
    } catch (err) {
      showToast("Error rendering UI: " + (err && err.message ? err.message : String(err)));
      document.getElementById('loadingIndicator').style.display = 'none';
    }
  }

  function onStateError(err) {
    var errMsg = "Connection error.";
    if (err && err.message) {
      errMsg = "Error loading data: " + err.message;
    } else if (typeof err === 'string') {
      errMsg = "Error loading data: " + err;
    }
    showToast(errMsg);
    document.getElementById('loadingIndicator').style.display = 'none';
  }

  function fetchInitialState(user) {
    document.getElementById('loadingIndicator').style.display = 'block';
    document.getElementById('viewContent').innerHTML = '';
    document.getElementById('actionBar').style.display = 'none';
    appState.selections = [];

    google.script.run
      .withSuccessHandler(onStateLoaded)
      .withFailureHandler(onStateError)
      .getInitialState(user, appState.pin);
  }

  function updateHeader() {
    if (appState.activeYear) {
      document.getElementById('activeYearLabel').innerText = appState.activeYear;
    }

    var phaseName = appState.phase || 'LOADING';
    if (phaseName === 'VACATION_SENIORITY') phaseName = 'VACATION SENIORITY';
    else if (phaseName === 'VACATION_RANDOM') phaseName = 'VACATION LOTTERY';
    else if (phaseName === 'WEEKEND') phaseName = 'WEEKEND COVERAGE';
    else if (phaseName === 'HOLIDAY_VOLUNTEER') phaseName = 'HOLIDAY VOLUNTEER';
    else if (phaseName === 'HOLIDAY_MANDATORY') phaseName = 'HOLIDAY MANDATORY';
    else phaseName = phaseName.replace(/_/g, ' ');

    document.getElementById('phaseLabel').innerText = phaseName;

    if (appState.round) {
      document.getElementById('roundLabel').innerText = "R" + appState.round + " (" + (appState.direction === 'ASCENDING' ? 'Forward' : 'Reverse') + ")";
    } else {
      document.getElementById('roundLabel').innerText = "";
    }

    // Auth-specific header items
    var isLogged = !!appState.participantId;
    var nameLabel = document.getElementById('userNameLabel');
    var rulesBtn = document.getElementById('rulesBtn');
    var logoutBtn = document.getElementById('logoutBtn');

    nameLabel.style.display = isLogged ? 'inline' : 'none';
    rulesBtn.style.display = isLogged ? 'inline-block' : 'none';
    logoutBtn.style.display = isLogged ? 'inline-block' : 'none';

    if (isLogged) {
      nameLabel.innerText = appState.name;
    }

    var badge = document.getElementById('statusBadge');

    if (isLogged) {
      if (appState.isActive) {
        badge.className = 'status-pill status-active';
        badge.innerText = 'ACTIVE - YOUR TURN';
      } else {
        badge.className = 'status-pill status-waiting';
        badge.innerText = 'WAITING - IN QUEUE';
      }
    } else {
      badge.className = 'status-pill status-guest';
      badge.innerText = 'GUEST / LOG IN';
    }
  }

  // Rules Acknowledgment
  function checkRulesAcknowledgment() {
    try {
      if (appState.participant && String(appState.participant['Rules Acknowledged Year']) !== String(appState.activeYear)) {
        document.getElementById('rulesYearSpan').innerText = appState.activeYear;
        document.getElementById('rulesModal').style.display = 'flex';
        document.getElementById('loadingIndicator').style.display = 'none';
      } else {
        renderPhaseView();
      }
    } catch (err) {
      showToast("Error checking rules acknowledgment: " + err.message);
      document.getElementById('loadingIndicator').style.display = 'none';
    }
  }

  function checkRulesForm() {
    var volRadio = document.querySelector('input[name="volunteerChoice"]:checked');
    var transRadio = document.querySelector('input[name="transferPrefRadio"]:checked');
    var vol = volRadio ? volRadio.value : '';
    var trans = transRadio ? transRadio.value : '';
    document.getElementById('saveRulesBtn').disabled = !(vol && trans);
  }

  function saveRules() {
    var volRadio = document.querySelector('input[name="volunteerChoice"]:checked');
    var transRadio = document.querySelector('input[name="transferPrefRadio"]:checked');
    var vol = volRadio ? volRadio.value : '';
    var trans = transRadio ? transRadio.value : '';

    var btn = document.getElementById('saveRulesBtn');

    btn.disabled = true;
    btn.innerText = "Saving...";

    google.script.run
      .withSuccessHandler(function() {
        document.getElementById('rulesModal').style.display = 'none';
        // Reload state to reflect updated config
        fetchInitialState(appState.participantId);
      })
      .withFailureHandler(function(error) {
        showToast("Error saving rules: " + error.message);
        btn.disabled = false;
        btn.innerText = "Save & Continue";
      })
      .saveRulesAcknowledgment(appState.participantId, vol, trans);
  }

  // View Rendering
  function renderPhaseView() {
    document.getElementById('loadingIndicator').style.display = 'none';
    var container = document.getElementById('viewContent');
    container.innerHTML = '';

    if (appState.phase === 'VACATION_SENIORITY' || appState.phase === 'VACATION_RANDOM') {
      renderVacationPhase(container);
    } else if (appState.phase === 'WEEKEND') {
      renderWeekendPhase(container);
    } else if (appState.phase === 'HOLIDAY_VOLUNTEER' || appState.phase === 'HOLIDAY_MANDATORY') {
      renderHolidayPhase(container);
    } else if (appState.phase === 'TRANSFER_OFFER_COLLECTION') {
      renderTransferOfferPhase(container);
    } else if (appState.phase === 'TRANSFER_RECEIVER') {
      renderTransferReceiverPhase(container);
    } else if (appState.phase === 'COMPLETE') {
      container.innerHTML = '<div class="card"><div class="card-content"><p class="card-title">Lottery Complete</p><p>All phases of the lottery have concluded for this year.</p></div></div>';
    } else {
      container.innerHTML = '<p>Please wait for the administrator to start a lottery phase.</p>';
    }

    updateActionBar();
  }

  function formatDateDisplay(dateStr) {
    if (!dateStr) return '';
    try {
      var d = new Date(dateStr + 'T00:00:00');
      if (isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    } catch(e) { return dateStr; }
  }

  function renderVacationPhase(container) {
    var weeks = appState.availableChoices.vacation;
    if (!weeks || weeks.length === 0) {
      container.innerHTML = '<p>No vacation weeks available.</p>';
      return;
    }

    // Check restrictions
    var hadSpringBreak = (appState.participant['Had Spring Break Last Year'] === true || appState.participant['Had Spring Break Last Year'] === 'TRUE');
    var hadChristmas = (appState.participant['Had Christmas Week Last Year'] === true || appState.participant['Had Christmas Week Last Year'] === 'TRUE');
    var isEarlyRound = appState.round <= 3;

    var html = '<h3>Select Vacation Weeks</h3>';

    for (var i = 0; i < weeks.length; i++) {
      var w = weeks[i];
      var weekId = w['Week ID'];
      var capacity = parseInt(w['Capacity']) || 4;
      var assigneesStr = w['Assigned Participants'] || '';
      var assigneesList = assigneesStr ? String(assigneesStr).split(',').map(function(s){return s.trim();}) : [];
      var isFull = assigneesList.length >= capacity;
      var alreadySelected = assigneesList.indexOf(appState.participantId) !== -1;

      var isPrime = String(w['Prime Classification']).toLowerCase() === 'prime';
      var special = w['Special Week Designation'];

      var disabled = false;
      var disableReason = '';

      if (isFull) { disabled = true; disableReason = 'Full'; }
      if (alreadySelected) { disabled = true; disableReason = 'Already Selected'; }
      if (isEarlyRound && special === 'Spring Break' && hadSpringBreak) { disabled = true; disableReason = 'Restricted (Had Last Year)'; }
      if (isEarlyRound && special === 'Christmas' && hadChristmas) { disabled = true; disableReason = 'Restricted (Had Last Year)'; }

      var cardClass = 'card';
      if (disabled) cardClass += ' disabled';

      var badgesHtml = '';
      if (isPrime) badgesHtml += '<span class="badge badge-prime">Prime</span>';
      else badgesHtml += '<span class="badge badge-nonprime">Non-Prime</span>';
      if (special && special !== 'None') badgesHtml += '<span class="badge badge-special">' + special + '</span>';
      if (disableReason) badgesHtml += '<span class="badge badge-warning">' + disableReason + '</span>';

      var assignedPills = '';
      if (assigneesList.length > 0) {
        for (var j = 0; j < assigneesList.length; j++) {
            assignedPills += '<span class="assignee-pill">' + assigneesList[j] + '</span>';
        }
      } else {
        assignedPills = '<span>None</span>';
      }

      html += '<div class="' + cardClass + '" data-id="' + weekId + '" data-prime="' + isPrime + '" onclick="toggleSelection(this, \'vacation\')">';
      html += '  <div class="card-content">';
      html += '    <h4 class="card-title">Week ' + weekId + ' (' + formatDateDisplay(w['Start Date (Monday)']) + ')</h4>';
      html += '    <div class="badge-container">' + badgesHtml + '</div>';
      html += '    <div class="assignees"><span class="capacity-text">Assigned (' + assigneesList.length + '/' + capacity + '):</span> ' + assignedPills + '</div>';
      html += '  </div>';
      html += '</div>';
    }

    container.innerHTML = html;
  }

  function renderWeekendPhase(container) {
    var weekends = appState.availableChoices.weekend;
    if (!weekends || weekends.length === 0) {
      container.innerHTML = '<p>No weekends available.</p>';
      return;
    }

    var html = '<h3>Select a Weekend Position</h3>';
    html += '<div class="weekend-grid">';

    for (var i = 0; i < weekends.length; i++) {
      var w = weekends[i];
      var dateStr = w['Date'];
      // handle date objects returned via API
      if (typeof dateStr === 'object' && dateStr !== null) {
          // If GAS sent an ISO string via JSON
          dateStr = dateStr.substring ? dateStr.substring(0,10) : dateStr;
      } else if (dateStr) {
          // Attempt format
          try {
             var d = new Date(dateStr + 'T00:00:00');
             var m = '' + (d.getMonth() + 1);
             var dDay = '' + d.getDate();
             var y = d.getFullYear();
             if(m.length<2) m='0'+m;
             if(dDay.length<2) dDay='0'+dDay;
             dateStr = [y,m,dDay].join('-');
          } catch(e){}
      }

      var dayOfWeek = w['Day of Week'];
      var assignee = w['First Call Assignee'];

      var disabled = assignee ? true : false;
      var cardClass = 'card';
      if (disabled) cardClass += ' disabled';

      var badgesHtml = '';
      // It's possible the backend didn't calculate "Consecutive Weekends Warning" explicitly,
      // or we just need to add a generic badge if it exists. Assuming it might be added to the sheet later
      // or calculated on the fly. We'll add support for the column 'Consecutive Weekends Warning' just in case,
      // or a generic "Consecutive" badge.
      if (w['Consecutive Weekends Warning']) badgesHtml += '<span class="badge badge-warning">Consecutive</span>';
      if (w.nearVacation) badgesHtml += '<span class="badge badge-warning">Near Vacation</span>';
      if (w['Holiday Proximity Warning']) badgesHtml += '<span class="badge badge-info">Near Holiday: ' + w['Holiday Proximity Warning'] + '</span>';

      var displayDate = formatDateDisplay(w['Date']);

      html += '<div class="' + cardClass + '" data-id="' + dateStr + '" data-holwarning="' + (w['Holiday Proximity Warning']||'') + '" onclick="toggleSelection(this, \'weekend\')">';
      html += '  <div class="card-content">';
      html += '    <h4 class="card-title">' + dayOfWeek + ' - ' + displayDate + '</h4>';
      if (badgesHtml) html += '    <div style="margin-bottom:8px;">' + badgesHtml + '</div>';
      html += '    <div class="assignees">Assignee: ' + (assignee || 'Available') + '</div>';
      html += '  </div>';
      html += '</div>';
    }

    html += '</div>';
    container.innerHTML = html;
  }

  function renderHolidayPhase(container) {
    var holidays = appState.availableChoices.holiday;
    if (!holidays || holidays.length === 0) {
      container.innerHTML = '<p>No holidays available.</p>';
      return;
    }

    var html = '<h3>Select a Holiday Position</h3>';

    for (var i = 0; i < holidays.length; i++) {
      var h = holidays[i];
      var assignee = h['Assigned Participant'];
      var disabled = assignee ? true : false;
      var cardClass = 'card';
      if (disabled) cardClass += ' disabled';

      var idStr = h['Holiday Name'] + '|' + h['Call Position (Call 1 / Call 2)'];
      var posLabel = h['Call Position (Call 1 / Call 2)'];

      html += '<div class="' + cardClass + '" data-id="' + idStr + '" data-name="' + h['Holiday Name'] + '" data-pos="' + posLabel + '" onclick="toggleSelection(this, \'holiday\')">';
      html += '  <div class="card-content">';
      html += '    <h4 class="card-title">' + h['Holiday Name'] + ' - ' + posLabel + '</h4>';
      html += '    <div class="card-subtitle">' + formatDateDisplay(h['Observed Date']) + '</div>';
      html += '    <div class="assignees">Assignee: ' + (assignee || 'Available') + '</div>';
      html += '  </div>';
      html += '</div>';
    }

    container.innerHTML = html;
  }

  function renderTransferOfferPhase(container) {
    var myAssignments = appState.availableChoices.myAssignments;
    if (!myAssignments || myAssignments.length === 0) {
      container.innerHTML = '<p>You have no current assignments to offer.</p>';
      // Show pass btn
      updateActionBar();
      return;
    }

    var html = '<h3>Select an assignment to put in the Transfer Pool</h3>';
    html += '<p style="color:var(--danger); font-weight:bold;">WARNING: Offers are irrevocable once submitted.</p>';

    for (var i = 0; i < myAssignments.length; i++) {
      var a = myAssignments[i];
      var displayStr = '';
      var valStr = '';
      if (a.type === 'VACATION') {
        displayStr = 'Vacation Week ' + a.details['Week ID'] + ' (' + formatDateDisplay(a.details['Start Date (Monday)']) + ')';
        valStr = a.details['Week ID'];
      } else if (a.type === 'WEEKEND') {
        var dStr = a.details['Date'];
        if (typeof dStr === 'object' && dStr !== null) dStr = dStr.substring ? dStr.substring(0,10) : dStr;
        try {
           var dt = new Date(dStr);
           var mm = ''+(dt.getMonth()+1), dd=''+dt.getDate(), yy=dt.getFullYear();
           if(mm.length<2)mm='0'+mm; if(dd.length<2)dd='0'+dd;
           dStr = [yy,mm,dd].join('-');
        } catch(e){}
        displayStr = a.details['Day of Week'] + ' ' + formatDateDisplay(a.details['Date']);
        valStr = dStr;
      } else if (a.type === 'HOLIDAY') {
        displayStr = a.details['Holiday Name'] + ' - ' + a.details['Call Position (Call 1 / Call 2)'];
        valStr = displayStr;
      }

      var objStr = JSON.stringify({ type: a.type, datePos: valStr });
      var encodedObj = objStr.replace(/"/g, '&quot;');

      html += '<div class="card" data-json="' + encodedObj + '" onclick="toggleSelection(this, \'transferOffer\')">';
      html += '  <div class="card-content">';
      html += '    <h4 class="card-title">' + a.type + '</h4>';
      html += '    <div class="card-subtitle">' + displayStr + '</div>';
      html += '  </div>';
      html += '</div>';
    }

    container.innerHTML = html;
  }

  function renderTransferReceiverPhase(container) {
    var offers = appState.availableChoices.transferOffers;
    if (!offers || offers.length === 0) {
      container.innerHTML = '<p>No transfer offers available.</p>';
      updateActionBar();
      return;
    }

    var html = '<h3>Select a Transfer Offer to Claim</h3>';

    for (var i = 0; i < offers.length; i++) {
      var o = offers[i];
      html += '<div class="card" data-id="' + o['Offer ID'] + '" onclick="toggleSelection(this, \'transferReceiver\')">';
      html += '  <div class="card-content">';
      html += '    <h4 class="card-title">' + o['Assignment Type'] + '</h4>';
      html += '    <div class="card-subtitle">' + o['Date/Position'] + '</div>';
      html += '    <div class="assignees">Offered by: ' + o['Original Assignee (Giver)'] + '</div>';
      html += '  </div>';
      html += '</div>';
    }

    container.innerHTML = html;
  }

  // Selection Logic
  function toggleSelection(element, type) {
    if (!appState.isActive) return;
    if (element.classList.contains('disabled')) return;

    var id;
    if (type === 'transferOffer') {
       id = element.getAttribute('data-json');
    } else {
       id = element.getAttribute('data-id');
    }

    var idx = appState.selections.indexOf(id);

    if (idx > -1) {
      // Remove
      appState.selections.splice(idx, 1);
      element.classList.remove('selected');
    } else {
      // Add based on rules
      if (type === 'vacation') {
        var isPrime = element.getAttribute('data-prime') === 'true';
        var currentPrimeCount = 0;
        var currentNonPrimeCount = 0;

        // Analyze current selections
        var cards = document.querySelectorAll('.card.selected');
        cards.forEach(function(c) {
          if (c.getAttribute('data-prime') === 'true') currentPrimeCount++;
          else currentNonPrimeCount++;
        });

        if (isPrime && (currentPrimeCount > 0 || currentNonPrimeCount > 0)) {
          showToast("You can only select 1 Prime week. Please deselect other choices first.");
          return;
        }
        if (!isPrime && currentPrimeCount > 0) {
          showToast("You cannot combine Prime and Non-Prime weeks.");
          return;
        }
        if (!isPrime && currentNonPrimeCount >= 2) {
          showToast("You can only select up to 2 Non-Prime weeks.");
          return;
        }
      } else {
        // All other phases allow only 1 selection
        appState.selections = [];
        document.querySelectorAll('.card.selected').forEach(function(c) { c.classList.remove('selected'); });
      }

      appState.selections.push(id);
      element.classList.add('selected');
    }

    updateActionBar();
  }

  function updateActionBar() {
    var bar = document.getElementById('actionBar');
    var btn = document.getElementById('submitSelectionBtn');
    var passBtn = document.getElementById('passBtn');
    var summary = document.getElementById('selectionSummary');

    // Default hidden
    bar.style.display = 'none';
    passBtn.style.display = 'none';

    if (!appState.isActive) return;

    bar.style.display = 'flex';

    if (appState.phase === 'HOLIDAY_VOLUNTEER' || appState.phase === 'TRANSFER_RECEIVER' || appState.phase === 'TRANSFER_OFFER_COLLECTION') {
      passBtn.style.display = 'block';
      passBtn.innerText = appState.phase === 'TRANSFER_RECEIVER' ? "None" : (appState.phase === 'TRANSFER_OFFER_COLLECTION' ? "Done Offering" : "Pass");
    }

    if (appState.selections.length > 0) {
      btn.disabled = false;
      summary.innerText = appState.selections.length + " Selected";

      if (appState.phase === 'VACATION_SENIORITY' || appState.phase === 'VACATION_RANDOM') {
        var nonPrimeCount = 0;
        document.querySelectorAll('.card.selected').forEach(function(c) {
          if (c.getAttribute('data-prime') !== 'true') nonPrimeCount++;
        });
        if (nonPrimeCount === 2) {
          summary.innerHTML = appState.selections.length + " Selected <br><small style='color:var(--warning)'>Note: Next turn forfeited</small>";
        }
      }
    } else {
      btn.disabled = true;
      summary.innerText = "No selection";
    }
  }

  function submitSelection(isPass) {
    var isActionPass = isPass === true;
    var actionType = isActionPass ? (appState.phase === 'TRANSFER_RECEIVER' ? 'NONE' : 'PASS') : 'SUBMIT';

    var data = {
      phase: appState.phase,
      action: actionType,
      selections: []
    };

    if (!isActionPass) {
      if (appState.phase === 'VACATION_SENIORITY' || appState.phase === 'VACATION_RANDOM') {
        data.selections = appState.selections;
      } else if (appState.phase === 'WEEKEND') {
        data.selections = appState.selections; // Array of dates

        // Check for adjacent holiday warning ONLY if we haven't already processed it
        if (!appState.adjacentHolidayPending) {
           var el = document.querySelector('.card.selected');
           var holWarning = el ? el.getAttribute('data-holwarning') : '';

           if (holWarning && holWarning !== 'undefined' && holWarning !== '') {
             showHolidayPrompt(holWarning);
             return; // Stop execution, wait for modal
           }
        } else {
           // We have a pending holiday attachment
           if (appState.adjacentHolidayPending !== 'DECLINED') {
             data.adjacentHoliday = appState.adjacentHolidayPending;
           }
        }
      } else if (appState.phase === 'HOLIDAY_VOLUNTEER' || appState.phase === 'HOLIDAY_MANDATORY') {
        var idStr = appState.selections[0];
        var parts = idStr.split('|');
        data.selections = [{ name: parts[0], position: parts[1] }];
      } else if (appState.phase === 'TRANSFER_OFFER_COLLECTION') {
        var obj = JSON.parse(appState.selections[0].replace(/&quot;/g, '"'));
        data.selections = [obj];
      } else if (appState.phase === 'TRANSFER_RECEIVER') {
        data.selections = appState.selections;
      }
    }

    executeSubmit(data);
  }

  function executeSubmit(data) {
    var btn = document.getElementById('submitSelectionBtn');
    var passBtn = document.getElementById('passBtn');
    btn.disabled = true;
    passBtn.disabled = true;
    btn.innerText = "Submitting...";

    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          appState.adjacentHolidayPending = null;
          showToast("Submission successful!", "success");
          fetchInitialState(appState.participantId); // Reload state
          loadPublicDisplay(true); // Forced public refresh
        }
      })
      .withFailureHandler(function(error) {
        btn.disabled = false;
        passBtn.disabled = false;
        btn.innerText = "Submit Selection";
        showToast(error.message);

        // If it's a concurrency error (e.g. someone else took it), auto-refresh state
        if (error.message.indexOf('selected by another') !== -1 || error.message.indexOf('claimed by another') !== -1) {
           setTimeout(function() { fetchInitialState(appState.participantId); }, 1500);
        }
      })
      .submitSelection(appState.participantId, data);
  }

  // Holiday Prompt Logic
  function showHolidayPrompt(holidayName) {
    document.getElementById('adjacentHolidayName').innerText = holidayName;
    var optsContainer = document.getElementById('adjacentHolidayOptions');
    optsContainer.innerHTML = 'Loading holiday availability...';

    document.getElementById('confirmHolidayBtn').disabled = true;
    document.getElementById('holidayPromptModal').style.display = 'flex';

    // Find holiday in state
    var holidays = appState.availableChoices.holiday; // Note: Ensure getInitialState always returns holiday array in Weekend phase too, or we need to fetch it.
    // Wait, getInitialState only returns phase specific choices.
    // Let's modify the frontend to gracefully handle missing holiday data by allowing decline.

    if (!holidays) {
       // Fallback if data is missing
       optsContainer.innerHTML = `
         <label class="radio-option"><input type="radio" name="holOpt" value="Call 2"> Call 2</label>
         <label class="radio-option"><input type="radio" name="holOpt" value="Call 1"> Call 1</label>
       `;
    } else {
       var html = '';
       var hasAvailability = false;
       for (var i = 0; i < holidays.length; i++) {
         if (holidays[i]['Holiday Name'] === holidayName) {
           var pos = holidays[i]['Call Position (Call 1 / Call 2)'];
           var assignee = holidays[i]['Assigned Participant'];
           if (!assignee) {
             hasAvailability = true;
             html += '<label class="radio-option"><input type="radio" name="holOpt" value="' + pos + '"> ' + pos + '</label>';
           }
         }
       }

       if (hasAvailability) {
         optsContainer.innerHTML = html;
       } else {
         optsContainer.innerHTML = '<p class="error-text">No positions available for this holiday.</p>';
         // Allow them to decline without selecting a position
         document.getElementById('confirmHolidayBtn').style.display = 'none';
         document.getElementById('declineHolidayBtn').classList.replace('btn-secondary', 'btn-primary');
         return;
       }
    }

    var radios = document.querySelectorAll('input[name="holOpt"]');
    radios.forEach(function(r) {
      r.addEventListener('change', function() {
        document.getElementById('confirmHolidayBtn').disabled = false;
      });
    });
  }

  function confirmHolidaySelection() {
    var selectedRadio = document.querySelector('input[name="holOpt"]:checked');
    if (selectedRadio) {
      appState.adjacentHolidayPending = {
        holidayName: document.getElementById('adjacentHolidayName').innerText,
        position: selectedRadio.value
      };
      document.getElementById('holidayPromptModal').style.display = 'none';
      submitSelection(false);
    }
  }

  function declineHolidaySelection() {
    // Explicitly record that the user declined the holiday offer, so only the weekend is selected
    appState.adjacentHolidayPending = 'DECLINED';
    document.getElementById('holidayPromptModal').style.display = 'none';
    submitSelection(false);
  }

  // =========================================================================
  // Public Display
  // =========================================================================

  function loadPublicDisplay(isForcedRefresh) {
    if (publicDisplayState.loading) {
      if (isForcedRefresh) {
        publicDisplayState.refreshPending = true;
      }
      return;
    }

    publicDisplayState.loading = true;

    // Only show loading indicator if we don't already have a valid snapshot loaded
    if (!publicDisplayState.loaded) {
      document.getElementById('publicDisplayLoading').style.display = 'block';
      document.getElementById('publicDisplayError').style.display = 'none';
      document.getElementById('publicDisplayContent').style.display = 'none';
    }

    google.script.run
      .withSuccessHandler(onPublicDisplayLoaded)
      .withFailureHandler(onPublicDisplayError)
      .getPublicDisplaySnapshot();
  }

  function onPublicDisplayError() {
    publicDisplayState.loading = false;

    // Only show error if we don't have a successful snapshot already loaded
    if (!publicDisplayState.loaded) {
      var errEl = document.getElementById('publicDisplayError');
      errEl.textContent = "The current schedule is temporarily unavailable.";
      errEl.style.display = 'block';
      document.getElementById('publicDisplayLoading').style.display = 'none';
    }

    checkPendingRefresh();
  }

  function onPublicDisplayLoaded(snapshot) {
    publicDisplayState.loading = false;

    // Validate Snapshot
    if (!snapshot || typeof snapshot !== 'object' || snapshot.success !== true || !snapshot.calendar || typeof snapshot.calendar !== 'object' || !Array.isArray(snapshot.participantNames) || !snapshot.queue || typeof snapshot.queue !== 'object' || !Array.isArray(snapshot.queue.activeNames) || !Array.isArray(snapshot.queue.upNextNames)) {
      onPublicDisplayError();
      return;
    }

    publicDisplayState.loaded = true;
    publicDisplayState.snapshot = snapshot;

    document.getElementById('publicDisplayLoading').style.display = 'none';
    document.getElementById('publicDisplayError').style.display = 'none';
    document.getElementById('publicDisplayContent').style.display = 'block';

    renderPublicPhaseHeading(snapshot);
    populateFindPerson(snapshot.participantNames);
    renderPublicQueue(snapshot);
    renderPublicCalendar(snapshot);
    applyFindPersonHighlights(); // reapply highlights after rendering new calendar

    checkPendingRefresh();
  }

  function checkPendingRefresh() {
    if (publicDisplayState.refreshPending) {
      publicDisplayState.refreshPending = false;
      loadPublicDisplay(true);
    }
  }

  function renderPublicQueue(snapshot) {
    var activeList = document.getElementById('publicActiveList');
    var upNextList = document.getElementById('publicUpNextList');

    activeList.innerHTML = '';
    upNextList.innerHTML = '';

    var queue = snapshot.queue || {};
    var activeNames = queue.activeNames || [];
    var upNextNames = queue.upNextNames || [];

    var validActive = [];
    for (var i = 0; i < activeNames.length; i++) {
      var name = String(activeNames[i] || '').trim();
      if (name) validActive.push(name);
    }

    if (validActive.length === 0) {
      var p = document.createElement('p');
      p.textContent = "No participants are currently ACTIVE.";
      activeList.appendChild(p);
    } else {
      var ul = document.createElement('ul');
      ul.className = 'public-queue-list';
      for (var i = 0; i < validActive.length; i++) {
        var li = document.createElement('li');
        li.className = 'public-queue-name public-active-name';
        li.textContent = validActive[i];
        ul.appendChild(li);
      }
      activeList.appendChild(ul);
    }

    var validUpNext = [];
    for (var i = 0; i < upNextNames.length; i++) {
      var name = String(upNextNames[i] || '').trim();
      if (name) validUpNext.push(name);
      if (validUpNext.length === 2) break; // Maximum 2
    }

    if (validUpNext.length === 0) {
      var p = document.createElement('p');
      p.textContent = "No eligible participants are currently previewed.";
      upNextList.appendChild(p);
    } else {
      var ol = document.createElement('ol');
      ol.className = 'public-queue-list';
      for (var i = 0; i < validUpNext.length; i++) {
        var li = document.createElement('li');
        li.className = 'public-queue-name public-up-next-name';
        var posSpan = document.createElement('span');
        posSpan.className = 'public-up-next-position';
        posSpan.textContent = (i + 1) + '. ';
        li.appendChild(posSpan);
        li.appendChild(document.createTextNode(validUpNext[i]));
        ol.appendChild(li);
      }
      upNextList.appendChild(ol);
    }
  }

  function renderPublicPhaseHeading(snapshot) {
    // We now render this info into the persistent top header instead of the main content area
    var headingEl = document.getElementById('publicPhaseHeading');
    if (headingEl) {
        headingEl.style.display = 'none'; // Ensure it stays hidden
    }

    if (!appState.participantId) {
        // Only update if guest; if logged in, main state syncs it
        if (snapshot.activeYear) {
            document.getElementById('activeYearLabel').innerText = snapshot.activeYear;
        }

        var phaseLabel = snapshot.phase || 'LOADING';
        if (phaseLabel === 'VACATION_SENIORITY') phaseLabel = 'VACATION SENIORITY';
        else if (phaseLabel === 'VACATION_RANDOM') phaseLabel = 'VACATION LOTTERY';
        else if (phaseLabel === 'WEEKEND') phaseLabel = 'WEEKEND COVERAGE';
        else if (phaseLabel === 'HOLIDAY_VOLUNTEER') phaseLabel = 'HOLIDAY VOLUNTEER';
        else if (phaseLabel === 'HOLIDAY_MANDATORY') phaseLabel = 'HOLIDAY MANDATORY';

        document.getElementById('phaseLabel').innerText = phaseLabel;

        var dirLabel = '';
        if (snapshot.direction === 'ASCENDING') dirLabel = ' (Forward)';
        else if (snapshot.direction === 'DESCENDING') dirLabel = ' (Reverse)';

        if (snapshot.round) {
            document.getElementById('roundLabel').innerText = 'R' + snapshot.round + dirLabel;
        } else {
            document.getElementById('roundLabel').innerText = '';
        }
    }
  }

  function formatPublicDate(val) {
    if (!val) return '';
    var str = String(val);
    var match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str);
    if (match) {
      var y = parseInt(match[1], 10);
      var m = parseInt(match[2], 10);
      var d = parseInt(match[3], 10);
      var dateObj = new Date(y, m - 1, d);
      return dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }
    return str;
  }

  function createPublicItem(type, obj) {
    var item = document.createElement('div');
    item.className = 'public-calendar-item card'; // Note: card handles the box look, we will override pointer/hover in CSS

    // Store assigned names for highlighting
    item.setAttribute('data-assignees', (obj.assignedNames || []).map(function(n) { return n.trim().toLowerCase(); }).join('|'));

    var header = document.createElement('h4');
    header.className = 'public-calendar-heading';

    var remStr = obj.assignedCount + ' of ' + obj.capacity + ' assigned · ' + obj.remainingCapacity + ' remaining';
    if (obj.remainingCapacity === 0) remStr += ' · Full';

    var subContent = document.createElement('div');
    subContent.className = 'badge-container';

    if (type === 'VACATION') {
      header.textContent = 'Week ' + obj.weekId + ' · ' + formatPublicDate(obj.startDate);

      if (obj.primeClassification && obj.primeClassification.toLowerCase() === 'prime') {
         var pBadge = document.createElement('span');
         pBadge.className = 'badge badge-prime';
         pBadge.textContent = 'Prime';
         subContent.appendChild(pBadge);
      } else if (obj.primeClassification) {
         var npBadge = document.createElement('span');
         npBadge.className = 'badge badge-nonprime';
         npBadge.textContent = 'Non-Prime';
         subContent.appendChild(npBadge);
      }

      if (obj.specialWeekDesignation && obj.specialWeekDesignation !== 'None') {
         var sBadge = document.createElement('span');
         sBadge.className = 'badge badge-special';
         sBadge.textContent = obj.specialWeekDesignation;
         subContent.appendChild(sBadge);
      }
    } else if (type === 'WEEKEND') {
      header.textContent = obj.dayOfWeek + ' · ' + formatPublicDate(obj.date);
      // Vacation Adjacency Warnings are strictly private and not displayed on the public calendar
      if (obj.holidayProximityWarning) {
        var hBadge = document.createElement('div');
        hBadge.className = 'badge badge-warning';
        hBadge.textContent = obj.holidayProximityWarning;
        subContent.appendChild(hBadge);
      }
    } else if (type === 'HOLIDAY') {
      header.textContent = obj.holidayName + ' (' + obj.callPosition + ') · ' + formatPublicDate(obj.observedDate);
    }

    var avail = document.createElement('div');
    avail.className = 'public-availability card-subtitle';
    avail.textContent = remStr;

    var assigned = document.createElement('div');
    assigned.className = 'public-assigned-names assignees';

    if (obj.assignedNames && obj.assignedNames.length > 0) {
      for (var j = 0; j < obj.assignedNames.length; j++) {
        var p = document.createElement('span');
        p.className = 'assignee-pill';
        p.textContent = obj.assignedNames[j];
        assigned.appendChild(p);
      }
    } else {
      assigned.textContent = 'No assignments';
    }

    var content = document.createElement('div');
    content.className = 'card-content';

    content.appendChild(header);
    if (subContent.hasChildNodes()) {
      content.appendChild(subContent);
    }
    content.appendChild(avail);
    content.appendChild(assigned);

    item.appendChild(content);
    return item;
  }

  function renderPublicCalendar(snapshot) {
    var container = document.getElementById('publicCalendarContent');
    container.innerHTML = '';

    var cal = snapshot.calendar;
    if (cal.supported === false) {
      var msg = document.createElement('p');
      msg.textContent = cal.unsupportedReason || "A calendar display is not available for the current phase.";
      container.appendChild(msg);
      return;
    }

    var grid = document.createElement('div');
    grid.className = 'public-calendar-grid';

    if (cal.kind === 'VACATION') {
       var weeks = cal.vacationWeeks || [];
       for (var i = 0; i < weeks.length; i++) {
         grid.appendChild(createPublicItem('VACATION', weeks[i]));
       }
       container.appendChild(grid);
    } else if (cal.kind === 'WEEKEND') {
       var headW = document.createElement('h3');
       headW.textContent = 'Weekend Coverage';
       container.appendChild(headW);

       var wGrid = document.createElement('div');
       wGrid.className = 'public-calendar-grid';
       var weekends = cal.weekends || [];
       for (var i = 0; i < weekends.length; i++) {
         wGrid.appendChild(createPublicItem('WEEKEND', weekends[i]));
       }
       container.appendChild(wGrid);

       var headH = document.createElement('h3');
       headH.textContent = 'Holiday Coverage';
       container.appendChild(headH);

       var hGrid = document.createElement('div');
       hGrid.className = 'public-calendar-grid';
       var holidays = cal.holidays || [];
       for (var i = 0; i < holidays.length; i++) {
         hGrid.appendChild(createPublicItem('HOLIDAY', holidays[i]));
       }
       container.appendChild(hGrid);
    } else if (cal.kind === 'HOLIDAY') {
       var hGrid = document.createElement('div');
       hGrid.className = 'public-calendar-grid';
       var holidays = cal.holidays || [];
       for (var i = 0; i < holidays.length; i++) {
         hGrid.appendChild(createPublicItem('HOLIDAY', holidays[i]));
       }
       container.appendChild(hGrid);
    }
  }

  function populateFindPerson(names) {
    var select = document.getElementById('findPersonSelect');
    var loginSelect = document.getElementById('loginName');

    // Only populate options if empty (initial load)
    if (select.options.length <= 1) {
      select.innerHTML = '<option value="">Select a person</option>';
      for (var i = 0; i < names.length; i++) {
         var opt = document.createElement('option');
         opt.value = names[i];
         opt.textContent = names[i];
         select.appendChild(opt);
      }
    }

    if (loginSelect && loginSelect.options.length <= 1) {
      loginSelect.innerHTML = '<option value="">Select your name</option>';
      for (var i = 0; i < names.length; i++) {
         var opt = document.createElement('option');
         opt.value = names[i];
         opt.textContent = names[i];
         loginSelect.appendChild(opt);
      }
    }
  }

  function applyFindPersonHighlights() {
    var searchVal = (publicDisplayState.selectedPerson || '').trim().toLowerCase();
    var items = document.querySelectorAll('.public-calendar-item');
    var resultEl = document.getElementById('findPersonResult');

    if (!searchVal) {
       items.forEach(function(item) {
          item.classList.remove('person-highlight');
       });
       resultEl.textContent = '';
       return;
    }

    var matchCount = 0;
    items.forEach(function(item) {
       var assignees = item.getAttribute('data-assignees');
       var assigneeList = assignees ? assignees.split('|') : [];
       var isMatch = assigneeList.indexOf(searchVal) !== -1;
       item.classList.toggle('person-highlight', isMatch);
       if (isMatch) matchCount++;
    });

    if (matchCount === 0) {
       resultEl.textContent = "No assignments found for " + publicDisplayState.selectedPerson + " in the current calendar.";
    } else {
       resultEl.textContent = matchCount + " assignment" + (matchCount === 1 ? "" : "s") + " highlighted for " + publicDisplayState.selectedPerson + ".";
    }
  }

</script>
