<script>
  // State
  var appState = {
    participantId: null,
    name: null,
    activeYear: null,
    phase: null,
    round: null,
    direction: null,
    isActive: false,
    participant: null,
    availableChoices: null,
    selections: [],
    adjacentHolidayPending: null
  };

  var cachedRulesText = null;

  // Public Display / Schedule State
  var publicDisplayState = {
    snapshot: null,
    loaded: false,
    loading: false,
    refreshPending: false,
    refreshTimerId: null
  };

  var scheduleFilters = {
    type: 'ALL',
    availability: 'ALL',
    month: 'ALL',
    person: '',
    myChoices: false
  };

  // Utility to show toasts
  function showToast(message, type) {
    type = type || 'error';
    var container = document.getElementById('toastContainer');
    var toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.innerText = message;
    container.appendChild(toast);
    setTimeout(function() {
      if (toast.parentNode) {
        toast.parentNode.removeChild(toast);
      }
    }, 5000);
  }

  // Set login loading state
  function setLoginLoading(isLoading) {
    var btn = document.getElementById('loginBtn');
    if (isLoading) {
      btn.innerText = "Logging in...";
      btn.disabled = true;
    } else {
      btn.innerText = "Log In";
      btn.disabled = false;
    }
  }

  // Utility to dismiss mobile keyboard
  function dismissKeyboard() {
    if (document.activeElement && typeof document.activeElement.blur === 'function') {
      document.activeElement.blur();
    }
    var pinInput = document.getElementById('loginPin');
    if (pinInput) {
      pinInput.blur();
    }
  }

  // Helper to wait for viewport stability after dismissing the keyboard
  function waitForViewportStability(callback) {
    var completed = false;
    var debounceTimer = null;
    var maxTimer = null;

    function finish() {
      if (completed) return;
      completed = true;
      clearTimeout(debounceTimer);
      clearTimeout(maxTimer);
      window.removeEventListener('resize', onResize);
      if (window.visualViewport) {
        window.visualViewport.removeEventListener('resize', onResize);
      }
      callback();
    }

    function onResize() {
      clearTimeout(debounceTimer);
      // Wait for 200ms of no resize events to consider the viewport stable
      debounceTimer = setTimeout(finish, 200);
    }

    // Set hard maximum timeout of 1200ms
    maxTimer = setTimeout(finish, 1200);

    window.addEventListener('resize', onResize);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', onResize);
    }
  }

  // Density Management
  function initDensityControl() {
    var savedDensity = localStorage.getItem('lotto_ui_density') || 'normal';
    if (['normal', 'compact', 'subcompact'].indexOf(savedDensity) === -1) {
      savedDensity = 'normal';
    }

    // Sync initial state to radio buttons
    var radios = document.querySelectorAll('input[name="densitySchedule"], input[name="densityLogged"]');
    radios.forEach(function(r) {
      if (r.value === savedDensity) r.checked = true;

      // Update aria-pressed
      var label = document.querySelector('label[for="' + r.id + '"]');
      if (label) {
        label.setAttribute('aria-pressed', r.checked ? 'true' : 'false');
      }

      r.addEventListener('change', function(e) {
        if (e.target.checked) {
          setUiDensity(e.target.value);
        }
      });
    });

    // Apply initial class
    applyDensityClass(savedDensity);
  }

  function setUiDensity(density) {
    localStorage.setItem('lotto_ui_density', density);

    // Sync all density radio buttons across both controls
    var radios = document.querySelectorAll('input[name="densitySchedule"], input[name="densityLogged"]');
    radios.forEach(function(r) {
      r.checked = (r.value === density);
      var label = document.querySelector('label[for="' + r.id + '"]');
      if (label) {
        label.setAttribute('aria-pressed', r.checked ? 'true' : 'false');
      }
    });

    applyDensityClass(density);
  }

  function applyDensityClass(density) {
    // Remove existing
    document.body.classList.remove('density-compact', 'density-subcompact');

    if (density === 'compact') {
      document.body.classList.add('density-compact');
    } else if (density === 'subcompact') {
      document.body.classList.add('density-subcompact');
    }
  }

  // Initialization
  document.addEventListener("DOMContentLoaded", function() {
    initDensityControl();

    // Check local storage for session
    var savedName = localStorage.getItem('lotto_user');

    if (savedName) {
      appState.participantId = savedName;
      appState.name = savedName;
      showMainScreen();
    } else {
      document.getElementById('loginScreen').classList.add('active');
      document.getElementById('scheduleSection').style.display = 'block';
      loadPublicDisplay();
    }

    // Background refresh timer
    if (!publicDisplayState.refreshTimerId) {
      publicDisplayState.refreshTimerId = setInterval(function() {
        if (document.visibilityState === 'visible' && isScheduleVisible()) {
          if (!publicDisplayState.loading) {
            loadPublicDisplay();
          }
        }
      }, 60000);
    }

    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible' && isScheduleVisible()) {
        if (!publicDisplayState.loading) {
          loadPublicDisplay();
        }
      }
    });

    // Schedule Filter Listeners
    document.getElementById('filterType').addEventListener('change', function(e) {
      scheduleFilters.type = e.target.value;
      renderPublicCalendar(publicDisplayState.snapshot);
    });

    document.getElementById('filterAvailability').addEventListener('change', function(e) {
      scheduleFilters.availability = e.target.value;
      renderPublicCalendar(publicDisplayState.snapshot);
    });

    document.getElementById('filterMonth').addEventListener('change', function(e) {
      scheduleFilters.month = e.target.value;
      renderPublicCalendar(publicDisplayState.snapshot);
    });

    document.getElementById('findPersonSelect').addEventListener('change', function(e) {
      scheduleFilters.person = e.target.value;
      // Selecting a person disables My Choices if active
      if (scheduleFilters.myChoices) {
        scheduleFilters.myChoices = false;
        document.getElementById('myChoicesBtn').setAttribute('aria-pressed', 'false');
      }
      renderPublicCalendar(publicDisplayState.snapshot);
    });

    document.getElementById('myChoicesBtn').addEventListener('click', function(e) {
      var btn = e.target;
      scheduleFilters.myChoices = !scheduleFilters.myChoices;
      btn.setAttribute('aria-pressed', scheduleFilters.myChoices ? 'true' : 'false');

      if (scheduleFilters.myChoices && appState.name) {
        scheduleFilters.person = appState.name;
        document.getElementById('findPersonSelect').value = appState.name;
      } else if (!scheduleFilters.myChoices && scheduleFilters.person === appState.name) {
        scheduleFilters.person = '';
        document.getElementById('findPersonSelect').value = '';
      }
      renderPublicCalendar(publicDisplayState.snapshot);
    });

    document.getElementById('clearFiltersBtn').addEventListener('click', function() {
      scheduleFilters.type = 'ALL';
      scheduleFilters.availability = 'ALL';
      scheduleFilters.month = 'ALL';
      scheduleFilters.person = '';
      scheduleFilters.myChoices = false;

      document.getElementById('filterType').value = 'ALL';
      document.getElementById('filterAvailability').value = 'ALL';
      document.getElementById('filterMonth').value = 'ALL';
      document.getElementById('findPersonSelect').value = '';
      document.getElementById('myChoicesBtn').setAttribute('aria-pressed', 'false');

      renderPublicCalendar(publicDisplayState.snapshot);
    });

    document.getElementById('refreshScheduleBtn').addEventListener('click', function() {
       if (!publicDisplayState.loading) {
          loadPublicDisplay();
       }
    });

    document.getElementById('scheduleToggleBtn').addEventListener('click', toggleScheduleView);


    // Event Listeners
    document.getElementById('loginBtn').addEventListener('click', handleLogin);
    document.getElementById('logoutBtn').addEventListener('click', handleLogout);
    document.getElementById('rulesBtn').addEventListener('click', function() {
      var modal = document.getElementById('infoModal');
      var content = document.getElementById('infoContent');

      modal.style.display = 'flex';

      if (cachedRulesText !== null) {
        content.textContent = cachedRulesText;
      } else {
        content.textContent = "Loading rules...";
        google.script.run
          .withSuccessHandler(function(text) {
            cachedRulesText = text;
            content.textContent = text;
          })
          .withFailureHandler(function(err) {
            content.textContent = "Failed to load rules: " + (err.message || "Unknown error");
          })
          .getRulesAndTips();
      }
    });
    document.getElementById('closeInfoBtn').addEventListener('click', function() {
      document.getElementById('infoModal').style.display = 'none';
    });

    // Segmented toggle listeners
    document.querySelectorAll('input[name="volunteerChoice"]').forEach(function(radio) {
      radio.addEventListener('change', checkRulesForm);
    });
    document.querySelectorAll('input[name="transferPrefRadio"]').forEach(function(radio) {
      radio.addEventListener('change', checkRulesForm);
    });

    document.getElementById('saveRulesBtn').addEventListener('click', saveRules);

    document.getElementById('modalRulesBtn').addEventListener('click', function() {
      document.getElementById('rulesBtn').click();
    });

    document.getElementById('submitSelectionBtn').addEventListener('click', submitSelection);
    document.getElementById('passBtn').addEventListener('click', function() {
      submitSelection(true); // isPass = true
    });

    document.getElementById('confirmHolidayBtn').addEventListener('click', confirmHolidaySelection);
    document.getElementById('declineHolidayBtn').addEventListener('click', declineHolidaySelection);
    document.getElementById('cancelWeekendBtn').addEventListener('click', function() {
      document.getElementById('holidayPromptModal').style.display = 'none';
      appState.adjacentHolidayPending = null;
    });
  });

  // Login
  function handleLogin() {
    var name = document.getElementById('loginName').value;
    var pin = document.getElementById('loginPin').value;
    var errorDiv = document.getElementById('loginError');

    if (!name || !pin) {
      errorDiv.innerText = "Please enter both name and Correct PIN.";
      errorDiv.style.display = 'block';
      return;
    }

    dismissKeyboard();
    setLoginLoading(true);
    errorDiv.style.display = 'none';

    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || typeof res !== 'object') {
          setLoginLoading(false);
          showToast("Invalid response from server.");
          return;
        }
        if (res.success !== true) {
          setLoginLoading(false);
          if (res.error === 'Invalid Name or PIN.') {
            errorDiv.innerText = "Incorrect PIN. Please try again.";
            errorDiv.style.display = 'block';
          } else {
            showToast(res.error || "Login failed");
          }
        } else if (!res.participantName) {
          setLoginLoading(false);
          showToast("Missing participant name in response.");
        } else {
          localStorage.setItem('lotto_user', res.participantName);
          appState.participantId = res.participantName;
          appState.name = res.participantName;
          appState.pin = pin; // Securely store pin in memory for privacy context fetches
          dismissKeyboard();
          waitForViewportStability(showMainScreen);
        }
      })
      .withFailureHandler(function(err) {
        setLoginLoading(false);
        errorDiv.innerText = "Unable to log in right now. Please try again.";
        errorDiv.style.display = 'block';
      })
      .authenticateParticipant(name, pin);
  }

  function resetToGuestState(errorMessage) {
    localStorage.removeItem('lotto_user');

    // Completely reset all schedule filters back to defaults
    scheduleFilters.type = 'ALL';
    scheduleFilters.availability = 'ALL';
    scheduleFilters.month = 'ALL';
    scheduleFilters.person = '';
    scheduleFilters.myChoices = false;

    document.getElementById('filterType').value = 'ALL';
    document.getElementById('filterAvailability').value = 'ALL';
    document.getElementById('filterMonth').value = 'ALL';
    var fp = document.getElementById('findPersonSelect');
    if (fp) fp.value = '';

    // Clear participant state securely
    appState.participantId = null;
    appState.name = null;
    appState.pin = null;
    appState.isActive = false;
    appState.participant = null;
    appState.availableChoices = null;
    appState.selections = [];
    appState.adjacentHolidayPending = null;

    // Hide all internal elements and restore Guest header
    document.getElementById('mainScreen').style.display = 'none';
    document.getElementById('userNameLabel').style.display = 'none';
    document.getElementById('userNameLabel').textContent = '';
    document.getElementById('logoutBtn').style.display = 'none';

    var statusBadge = document.getElementById('statusBadge');
    if (statusBadge) {
      statusBadge.className = 'status-pill status-guest';
      statusBadge.textContent = 'GUEST / LOG IN';
    }
    document.getElementById('scheduleToggleBtn').style.display = 'none';
    document.getElementById('scheduleToggleBtn').textContent = 'Schedule';
    document.getElementById('myChoicesBtn').style.display = 'none';
    document.getElementById('myChoicesBtn').setAttribute('aria-pressed', 'false');

    // Restore Guest View components
    document.getElementById('loginScreen').classList.add('active');
    document.getElementById('scheduleSection').style.display = 'block';

    document.getElementById('loginName').value = '';
    document.getElementById('loginPin').value = '';
    setLoginLoading(false);

    if (errorMessage) {
      showToast(errorMessage);
    }

    // Render the freshly reset filters visually without necessarily making a new fetch unless required.
    // However, logout generally requires re-fetching to guarantee guest context.
    document.getElementById('loadingIndicator').style.display = 'none';
    loadPublicDisplay(true); // Forced refresh ensures sanitized guest context
  }

  function handleLogout() {
    resetToGuestState();
  }

  // Main Screen & Data Loading
  function isScheduleVisible() {
    return document.getElementById('scheduleSection').style.display !== 'none';
  }

  function toggleScheduleView() {
    var mainScreen = document.getElementById('mainScreen');
    var scheduleSection = document.getElementById('scheduleSection');
    var btn = document.getElementById('scheduleToggleBtn');

    if (scheduleSection.style.display === 'none') {
      // Show Schedule
      mainScreen.style.display = 'none';
      scheduleSection.style.display = 'block';
      btn.textContent = 'Return to Selection';
      if (!publicDisplayState.loaded && !publicDisplayState.loading) {
         loadPublicDisplay();
      }
    } else {
      // Show Main Screen
      scheduleSection.style.display = 'none';
      mainScreen.style.display = 'block';
      btn.textContent = 'Schedule';
    }
  }

  function showMainScreen() {
    document.getElementById('loginScreen').classList.remove('active');
    document.getElementById('scheduleSection').style.display = 'none';
    document.getElementById('mainScreen').style.display = 'block';

    var toggleBtn = document.getElementById('scheduleToggleBtn');
    toggleBtn.style.display = 'inline-block';
    toggleBtn.textContent = 'Schedule';

    var myChoicesBtn = document.getElementById('myChoicesBtn');
    myChoicesBtn.style.display = 'inline-block';

    fetchInitialState(appState.participantId);
  }

  function handleInvalidSession(errorMessage) {
      resetToGuestState(errorMessage);
  }

  function onStateLoaded(state) {
    // 1. Defend against null, undefined, string, or non-object payload
    if (!state || typeof state !== 'object') {
      handleInvalidSession("Received invalid response from server.");
      return;
    }

    // 2. Check explicitly for server-reported failure
    if (state.success !== true) {
      handleInvalidSession(state.error || "Session invalid");
      return;
    }

    // 3. Ensure required data structure exists before accessing deeply
    if (!state.participant || !state.availableChoices) {
      handleInvalidSession("Malformed state response from server.");
      return;
    }

    try {
      appState.activeYear = state.activeYear;
      appState.phase = state.phase;
      appState.round = state.round;
      appState.direction = state.direction;
      appState.isActive = state.isActive;
      appState.participant = state.participant;
      appState.availableChoices = state.availableChoices;

      updateHeader();
      checkRulesAcknowledgment();
    } catch (err) {
      showToast("Error rendering UI: " + (err && err.message ? err.message : String(err)));
      document.getElementById('loadingIndicator').style.display = 'none';
    }
  }

  function onStateError(err) {
    var errMsg = "Connection error.";
    if (err && err.message) {
      errMsg = "Error loading data: " + err.message;
    } else if (typeof err === 'string') {
      errMsg = "Error loading data: " + err;
    }
    showToast(errMsg);
    document.getElementById('loadingIndicator').style.display = 'none';
  }

  function fetchInitialState(user) {
    document.getElementById('loadingIndicator').style.display = 'block';
    document.getElementById('viewContent').innerHTML = '';
    document.getElementById('actionBar').style.display = 'none';
    appState.selections = [];
    appState.adjacentHolidayPending = null;

    google.script.run
      .withSuccessHandler(onStateLoaded)
      .withFailureHandler(onStateError)
      .getInitialState(user, appState.pin);
  }

  function updateHeader() {
    if (appState.activeYear) {
      document.getElementById('activeYearLabel').innerText = appState.activeYear;
    }

    var phaseName = appState.phase || 'LOADING';
    if (phaseName === 'VACATION_SENIORITY') phaseName = 'VACATION SENIORITY';
    else if (phaseName === 'VACATION_RANDOM') phaseName = 'VACATION LOTTERY';
    else if (phaseName === 'WEEKEND') phaseName = 'WEEKEND COVERAGE';
    else if (phaseName === 'HOLIDAY_VOLUNTEER') phaseName = 'HOLIDAY VOLUNTEER';
    else if (phaseName === 'HOLIDAY_MANDATORY') phaseName = 'HOLIDAY MANDATORY';
    else phaseName = phaseName.replace(/_/g, ' ');

    document.getElementById('phaseLabel').innerText = phaseName;

    if (appState.round) {
      document.getElementById('roundLabel').innerText = "R" + appState.round + " (" + (appState.direction === 'ASCENDING' ? 'Forward' : 'Reverse') + ")";
    } else {
      document.getElementById('roundLabel').innerText = "";
    }

    // Auth-specific header items
    var isLogged = !!appState.participantId;
    var nameLabel = document.getElementById('userNameLabel');
    var rulesBtn = document.getElementById('rulesBtn');
    var logoutBtn = document.getElementById('logoutBtn');

    nameLabel.style.display = isLogged ? 'inline' : 'none';
    rulesBtn.style.display = 'inline-block';
    logoutBtn.style.display = isLogged ? 'inline-block' : 'none';

    if (isLogged) {
      nameLabel.innerText = appState.name;
    }

    var badge = document.getElementById('statusBadge');

    if (isLogged) {
      if (appState.isActive) {
        badge.className = 'status-pill status-active';
        badge.innerText = 'ACTIVE - YOUR TURN';
      } else {
        badge.className = 'status-pill status-waiting';
        badge.innerText = 'WAITING - IN QUEUE';
      }
    } else {
      badge.className = 'status-pill status-guest';
      badge.innerText = 'GUEST / LOG IN';
    }
  }

  // Rules Acknowledgment
  function checkRulesAcknowledgment() {
    try {
      if (appState.participant && String(appState.participant['Rules Acknowledged Year']) !== String(appState.activeYear)) {
        document.getElementById('rulesYearSpan').innerText = appState.activeYear;
        document.getElementById('rulesModal').style.display = 'flex';
        document.getElementById('loadingIndicator').style.display = 'none';
      } else {
        renderPhaseView();
      }
    } catch (err) {
      showToast("Error checking rules acknowledgment: " + err.message);
      document.getElementById('loadingIndicator').style.display = 'none';
    }
  }

  function checkRulesForm() {
    var volRadio = document.querySelector('input[name="volunteerChoice"]:checked');
    var transRadio = document.querySelector('input[name="transferPrefRadio"]:checked');
    var vol = volRadio ? volRadio.value : '';
    var trans = transRadio ? transRadio.value : '';
    document.getElementById('saveRulesBtn').disabled = !(vol && trans);
  }

  function saveRules() {
    var volRadio = document.querySelector('input[name="volunteerChoice"]:checked');
    var transRadio = document.querySelector('input[name="transferPrefRadio"]:checked');
    var vol = volRadio ? volRadio.value : '';
    var trans = transRadio ? transRadio.value : '';

    var btn = document.getElementById('saveRulesBtn');

    btn.disabled = true;
    btn.innerText = "Saving...";

    google.script.run
      .withSuccessHandler(function() {
        btn.disabled = false;
        btn.innerText = "Save & Continue";
        document.getElementById('rulesModal').style.display = 'none';
        // Reload state to reflect updated config
        fetchInitialState(appState.participantId);
      })
      .withFailureHandler(function(error) {
        showToast("Error saving rules: " + error.message);
        btn.disabled = false;
        btn.innerText = "Save & Continue";
      })
      .saveRulesAcknowledgment(appState.participantId, vol, trans);
  }

  // View Rendering
  function renderPhaseView() {
    document.getElementById('loadingIndicator').style.display = 'none';
    var container = document.getElementById('viewContent');
    container.innerHTML = '';

    var showDensityControl = false;

    if (appState.phase === 'VACATION_SENIORITY' || appState.phase === 'VACATION_RANDOM') {
      renderVacationPhase(container);
      showDensityControl = true;
    } else if (appState.phase === 'WEEKEND') {
      renderWeekendPhase(container);
      showDensityControl = true;
    } else if (appState.phase === 'HOLIDAY_VOLUNTEER' || appState.phase === 'HOLIDAY_MANDATORY') {
      renderHolidayPhase(container);
      showDensityControl = true;
    } else if (appState.phase === 'TRANSFER_OFFER_COLLECTION') {
      renderTransferOfferPhase(container);
      showDensityControl = true;
    } else if (appState.phase === 'TRANSFER_RECEIVER') {
      renderTransferReceiverPhase(container);
      showDensityControl = true;
    } else if (appState.phase === 'COMPLETE') {
      container.innerHTML = '<div class="card"><div class="card-content"><p class="card-title">Lottery Complete</p><p>All phases of the lottery have concluded for this year.</p></div></div>';
    } else {
      container.innerHTML = '<p>Please wait for the administrator to start a lottery phase.</p>';
    }

    var densityCtrl = document.getElementById('loggedInDensityControl');
    if (densityCtrl) {
      densityCtrl.style.display = showDensityControl ? 'flex' : 'none';
    }

    updateActionBar();
  }

  function escapeSoftHolidayText(value) {
    return String(value || '').replace(/[&<>"']/g, function(character) {
      return {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[character];
    });
  }

  function softHolidayBadgesHtml_(warnings) {
    var html = '';
    warnings = warnings || [];

    for (var i = 0; i < warnings.length; i++) {
      html +=
        '<span class="badge badge-info">' +
        escapeSoftHolidayText(warnings[i]) +
        '</span>';
    }

    return html;
  }

  function appendPublicSoftHolidayBadges_(container, warnings) {
    warnings = warnings || [];

    for (var i = 0; i < warnings.length; i++) {
      var badge = document.createElement('span');
      badge.className = 'badge badge-info';
      badge.textContent = warnings[i];
      container.appendChild(badge);
    }
  }

  /**
   * Normalizes a date string client-side to strictly 'YYYY-MM-DD'
   */
  function normalizeDateKeyClient(value) {
    if (!value) return '';
    var match = String(value).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (match) {
      var m = parseInt(match[2], 10);
      var d = parseInt(match[3], 10);
      if (m >= 1 && m <= 12 && d >= 1 && d <= 31) {
        return match[1] + '-' + match[2] + '-' + match[3];
      }
    }
    return '';
  }

  function formatDateDisplay(dateStr) {
    if (dateStr === null || dateStr === undefined || dateStr === '' || dateStr === 'null' || dateStr === 'undefined') return '';
    var norm = normalizeDateKeyClient(dateStr);
    if (!norm) return String(dateStr);
    var parts = norm.split('-');
    try {
      var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    } catch(e) { return norm; }
  }

  function renderVacationPhase(container) {
    var weeks = appState.availableChoices.vacation;
    if (!weeks || weeks.length === 0) {
      container.innerHTML = '<p>No vacation weeks available.</p>';
      return;
    }

    // Check restrictions
    var hadSpringBreak = (appState.participant['Had Spring Break Last Year'] === true || appState.participant['Had Spring Break Last Year'] === 'TRUE');
    var hadThanksgiving = (appState.participant['Had Thanksgiving Week Last Year'] === true || appState.participant['Had Thanksgiving Week Last Year'] === 'TRUE');
    var hadChristmas = (appState.participant['Had Christmas Week Last Year'] === true || appState.participant['Had Christmas Week Last Year'] === 'TRUE');
    var isEarlyRound = appState.round <= 3;

    var html = '<h3>Select Vacation Weeks</h3>';
    html += '<div class="vacation-grid">';

    for (var i = 0; i < weeks.length; i++) {
      var w = weeks[i];
      var weekId = w['Week ID'];
      var capacity = parseInt(w['Capacity']) || 4;
      var assigneesStr = w['Assigned Participants'] || '';
      var assigneesList = assigneesStr ? String(assigneesStr).split(',').map(function(s){return s.trim();}) : [];
      var isFull = assigneesList.length >= capacity;
      var alreadySelected = assigneesList.indexOf(appState.participantId) !== -1;

      var isPrime = String(w['Prime Classification']).toLowerCase() === 'prime';
      var special = w['Special Week Designation'];

      var disabled = false;
      var disableReason = '';

      if (isFull) { disabled = true; disableReason = 'Full'; }
      if (alreadySelected) { disabled = true; disableReason = 'Already Selected'; }

      if (isEarlyRound) {
        if (special === 'Spring Break' && hadSpringBreak) {
          disabled = true;
          disableReason = 'Unavailable \u2014 had Spring Break last year; eligible beginning in Round 4.';
        } else if (special === 'Thanksgiving' && hadThanksgiving) {
          disabled = true;
          disableReason = 'Unavailable \u2014 had Thanksgiving Week last year; eligible beginning in Round 4.';
        } else if (special === 'Christmas' && hadChristmas) {
          disabled = true;
          disableReason = 'Unavailable \u2014 had Christmas Week last year; eligible beginning in Round 4.';
        }
      }

      var cardClass = 'card';

        cardClass += ' disabled';
      } else if (capacity > 1 && capacity - assigneesList.length === 1) {
        cardClass += ' schedule-status-nearly-full';

  // Selection Logic
  function toggleSelection(element, type) {
    if (!appState.isActive) return;
    if (element.classList.contains('disabled')) return;

    var id;
    if (type === 'transferOffer' || type === 'transferReceiver') {
       id = element.getAttribute('data-json');
       if (!id || id === 'null' || id === 'undefined') {
          showToast("Unable to select this transfer offer. Please refresh and try again.");
          return;
       }
       try {
           JSON.parse(id);
       } catch(e) {
          showToast("Unable to select this transfer offer. Please refresh and try again.");
          return;
       }
    } else {
       id = element.getAttribute('data-id');
       if (!id) {
          showToast("Unable to select this item. Please refresh and try again.");
          return;
       }
    }

    var idx = appState.selections.indexOf(id);

    if (idx > -1) {
      // Remove
      appState.selections.splice(idx, 1);
      element.classList.remove('selected');
    } else {
      // Add based on rules
      if (type === 'vacation') {
        var isPrime = element.getAttribute('data-prime') === 'true';
        var currentPrimeCount = 0;
        var currentNonPrimeCount = 0;

        // Analyze current selections
        var cards = document.querySelectorAll('.card.selected');
        cards.forEach(function(c) {
          if (c.getAttribute('data-prime') === 'true') currentPrimeCount++;
          else currentNonPrimeCount++;
        });

        if (isPrime && (currentPrimeCount > 0 || currentNonPrimeCount > 0)) {
          showToast("You can only select 1 Prime week. Please deselect other choices first.");
          return;
        }
        if (!isPrime && currentPrimeCount > 0) {
          showToast("You cannot combine Prime and Non-Prime weeks.");
          return;
        }
        if (!isPrime && currentNonPrimeCount >= 2) {
          showToast("You can only select up to 2 Non-Prime weeks.");
          return;
        }
      } else if (type === 'transferOffer') {
        // Allow multiple selections for transferOffer
      } else {
        // All other phases allow only 1 selection
        appState.selections = [];
        document.querySelectorAll('.card.selected').forEach(function(c) { c.classList.remove('selected'); });
      }

      if (type === 'weekend') {
        appState.adjacentHolidayPending = null;
      }

      appState.selections.push(id);
      element.classList.add('selected');
    }

    updateActionBar();
  }

  function updateActionBar() {
    var bar = document.getElementById('actionBar');
    var btn = document.getElementById('submitSelectionBtn');
    var passBtn = document.getElementById('passBtn');
    var summary = document.getElementById('selectionSummary');

    // Default hidden
    bar.style.display = 'none';
    passBtn.style.display = 'none';

    if (!appState.isActive) return;

    bar.style.display = 'flex';

    if (appState.phase === 'HOLIDAY_VOLUNTEER' || appState.phase === 'TRANSFER_RECEIVER' || appState.phase === 'TRANSFER_OFFER_COLLECTION') {
      passBtn.style.display = 'block';
      passBtn.innerText = appState.phase === 'TRANSFER_RECEIVER' ? "None" : (appState.phase === 'TRANSFER_OFFER_COLLECTION' ? "Submit — No Giveaways" : "Pass");
    }

    if (appState.selections.length > 0) {
      btn.disabled = false;
      summary.innerText = appState.selections.length + " Selected";
      if (appState.phase === 'TRANSFER_OFFER_COLLECTION') {
        btn.innerText = "Submit Offers";
        passBtn.style.display = 'none'; // hide the "No Giveaways" button if they made selections
      } else {
        btn.innerText = "Submit Selection";
      }

      if (appState.phase === 'VACATION_SENIORITY' || appState.phase === 'VACATION_RANDOM') {
        var nonPrimeCount = 0;
        document.querySelectorAll('.card.selected').forEach(function(c) {
          if (c.getAttribute('data-prime') !== 'true') nonPrimeCount++;
        });
        if (nonPrimeCount === 2) {
          summary.innerHTML = appState.selections.length + " Selected <br><small style='color:var(--warning)'>Note: Next turn forfeited</small>";
        }
      }
    } else {
      btn.disabled = true;
      summary.innerText = "No selection";
      btn.innerText = "Submit Selection";
      if (appState.phase === 'TRANSFER_OFFER_COLLECTION') {
        // We have the passBtn as "Submit - No Giveaways"
        passBtn.style.display = 'block';
      }
    }
  }

  function submitSelection(isPass) {
    var isActionPass = isPass === true;
    var actionType = isActionPass ? (appState.phase === 'TRANSFER_RECEIVER' ? 'NONE' : 'PASS') : 'SUBMIT';

    var data = {
      phase: appState.phase,
      action: actionType,
      selections: []
    };

    if (!isActionPass) {
      if (appState.phase === 'VACATION_SENIORITY' || appState.phase === 'VACATION_RANDOM') {
        data.selections = appState.selections;
      } else if (appState.phase === 'WEEKEND') {
        data.selections = appState.selections; // Array of dates

        // Check for adjacent holiday warning ONLY if we haven't already processed it
        if (!appState.adjacentHolidayPending) {
           var el = document.querySelector('.card.selected');
           var holWarning = el ? el.getAttribute('data-holwarning') : '';

           if (holWarning && holWarning !== 'undefined' && holWarning !== '') {
             showHolidayPrompt(holWarning);
             return; // Stop execution, wait for modal
           }
        } else {
           // We have a pending holiday attachment
           if (appState.adjacentHolidayPending !== 'DECLINED') {
             data.adjacentHoliday = appState.adjacentHolidayPending;
           }
        }
      } else if (appState.phase === 'HOLIDAY_VOLUNTEER' || appState.phase === 'HOLIDAY_MANDATORY') {
        var idStr = appState.selections[0];
        var parts = idStr.split('|');
        data.selections = [{ name: parts[0], position: parts[1] }];
      } else if (appState.phase === 'TRANSFER_OFFER_COLLECTION') {
        data.selections = [];
        for (var i = 0; i < appState.selections.length; i++) {
          data.selections.push(JSON.parse(appState.selections[i].replace(/&quot;/g, '"')));
        }
      } else if (appState.phase === 'TRANSFER_RECEIVER') {
        data.selections = [];
        for (var i = 0; i < appState.selections.length; i++) {
          try {
             var parsed = JSON.parse(appState.selections[i].replace(/&quot;/g, '"'));
             if (parsed && (parsed.offerId || parsed.groupId)) {
                 data.selections.push(parsed);
             } else {
                 throw new Error("Missing offerId or groupId in payload.");
             }
          } catch(e) {
             showToast("Error processing selection data. Please refresh and try again.", "error");
             return;
          }
        }
      }
    }

    executeSubmit(data);
  }

  function executeSubmit(data) {
    var btn = document.getElementById('submitSelectionBtn');
    var passBtn = document.getElementById('passBtn');
    btn.disabled = true;
    passBtn.disabled = true;
    btn.innerText = "Submitting...";

    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false;
        passBtn.disabled = false;
        btn.innerText = "Submit Selection";

        if (res.success) {
          appState.adjacentHolidayPending = null;
          showToast(res.message || "Submission successful!", "success");
          fetchInitialState(appState.participantId); // Reload state
          loadPublicDisplay(true); // Forced public refresh
        }
      })
      .withFailureHandler(function(error) {
        btn.disabled = false;
        passBtn.disabled = false;
        btn.innerText = "Submit Selection";
        showToast(error.message);

        // If it's a concurrency error (e.g. someone else took it), auto-refresh state
        if (error.message.indexOf('selected by another') !== -1 || error.message.indexOf('claimed by another') !== -1) {
           setTimeout(function() { fetchInitialState(appState.participantId); }, 1500);
        }
      })
      .submitSelection(appState.participantId, data);
  }

  // Holiday Prompt Logic
  function showHolidayPrompt(holidayName) {
    document.getElementById('adjacentHolidayName').innerText = holidayName;
    var optsContainer = document.getElementById('adjacentHolidayOptions');
    optsContainer.innerHTML = 'Loading holiday availability...';

    document.getElementById('confirmHolidayBtn').disabled = true;
    document.getElementById('holidayPromptModal').style.display = 'flex';

    // Find holiday in state
    var holidays = appState.availableChoices.holiday; // Note: Ensure getInitialState always returns holiday array in Weekend phase too, or we need to fetch it.
    // Wait, getInitialState only returns phase specific choices.
    // Let's modify the frontend to gracefully handle missing holiday data by allowing decline.

    if (!holidays) {
       // Fallback if data is missing
       optsContainer.innerHTML = `
         <label class="radio-option"><input type="radio" name="holOpt" value="Call 2"> Call 2</label>
         <label class="radio-option"><input type="radio" name="holOpt" value="Call 1"> Call 1</label>
       `;
    } else {
       var html = '';
       var hasAvailability = false;
       for (var i = 0; i < holidays.length; i++) {
         if (holidays[i]['Holiday Name'] === holidayName) {
           var pos = holidays[i]['Call Position (Call 1 / Call 2)'];
           var assignee = holidays[i]['Assigned Participant'];
           if (!assignee) {
             hasAvailability = true;
             html += '<label class="radio-option"><input type="radio" name="holOpt" value="' + pos + '"> ' + pos + '</label>';
           }
         }
       }

       if (hasAvailability) {
         optsContainer.innerHTML = html;
       } else {
         optsContainer.innerHTML = '<p class="error-text">No positions available for this holiday.</p>';
         // Allow them to decline without selecting a position
         document.getElementById('confirmHolidayBtn').style.display = 'none';
         document.getElementById('declineHolidayBtn').classList.replace('btn-secondary', 'btn-primary');
         return;
       }
    }

    var radios = document.querySelectorAll('input[name="holOpt"]');
    radios.forEach(function(r) {
      r.addEventListener('change', function() {
        document.getElementById('confirmHolidayBtn').disabled = false;
      });
    });
  }

  function confirmHolidaySelection() {
    var selectedRadio = document.querySelector('input[name="holOpt"]:checked');
    if (selectedRadio) {
      appState.adjacentHolidayPending = {
        holidayName: document.getElementById('adjacentHolidayName').innerText,
        position: selectedRadio.value
      };
      document.getElementById('holidayPromptModal').style.display = 'none';
      submitSelection(false);
    }
  }

  function declineHolidaySelection() {
    // Explicitly record that the user declined the holiday offer, so only the weekend is selected
    appState.adjacentHolidayPending = 'DECLINED';
    document.getElementById('holidayPromptModal').style.display = 'none';
    submitSelection(false);
  }

  // =========================================================================
  // Public Display
  // =========================================================================

  function loadPublicDisplay(isForcedRefresh) {
    if (publicDisplayState.loading) {
      if (isForcedRefresh) {
        publicDisplayState.refreshPending = true;
      }
      return;
    }

    publicDisplayState.loading = true;

    // Only show loading indicator if we don't already have a valid snapshot loaded
    if (!publicDisplayState.loaded) {
      document.getElementById('publicDisplayLoading').style.display = 'block';
      document.getElementById('publicDisplayError').style.display = 'none';
      document.getElementById('publicDisplayContent').style.display = 'none';
    }

    google.script.run
      .withSuccessHandler(onPublicDisplayLoaded)
      .withFailureHandler(onPublicDisplayError)
      .getPublicDisplaySnapshot();
  }

  function onPublicDisplayError() {
    publicDisplayState.loading = false;

    // Only show error if we don't have a successful snapshot already loaded
    if (!publicDisplayState.loaded) {
      var errEl = document.getElementById('publicDisplayError');
      errEl.textContent = "The current schedule is temporarily unavailable.";
      errEl.style.display = 'block';
      document.getElementById('publicDisplayLoading').style.display = 'none';
    }

    checkPendingRefresh();
  }

  function onPublicDisplayLoaded(snapshot) {
    publicDisplayState.loading = false;

    // Validate Snapshot
    if (!snapshot || typeof snapshot !== 'object' || snapshot.success !== true || !snapshot.calendar || typeof snapshot.calendar !== 'object' || !Array.isArray(snapshot.participantNames) || !snapshot.queue || typeof snapshot.queue !== 'object' || !Array.isArray(snapshot.queue.activeNames) || !Array.isArray(snapshot.queue.upNextNames)) {
      onPublicDisplayError();
      return;
    }

    publicDisplayState.loaded = true;
    publicDisplayState.snapshot = snapshot;

    document.getElementById('publicDisplayLoading').style.display = 'none';
    document.getElementById('publicDisplayError').style.display = 'none';
    document.getElementById('publicDisplayContent').style.display = 'block';

    renderPublicPhaseHeading(snapshot);
    populateFindPerson(snapshot.participantNames);
    populateMonthFilter(snapshot);
    renderPublicQueue(snapshot);
    renderPublicCalendar(snapshot);

    checkPendingRefresh();
  }

  function checkPendingRefresh() {
    if (publicDisplayState.refreshPending) {
      publicDisplayState.refreshPending = false;
      loadPublicDisplay(true);
    }
  }

  function renderPublicQueue(snapshot) {
    var activeList = document.getElementById('publicActiveList');
    var upNextList = document.getElementById('publicUpNextList');

    activeList.innerHTML = '';
    upNextList.innerHTML = '';

    var queue = snapshot.queue || {};
    var activeNames = queue.activeNames || [];
    var upNextNames = queue.upNextNames || [];

    var validActive = [];
    for (var i = 0; i < activeNames.length; i++) {
      var name = String(activeNames[i] || '').trim();
      if (name) validActive.push(name);
    }

    if (validActive.length === 0) {
      var p = document.createElement('p');
      p.textContent = "No participants are currently ACTIVE.";
      activeList.appendChild(p);
    } else {
      var ul = document.createElement('ul');
      ul.className = 'public-queue-list';
      for (var i = 0; i < validActive.length; i++) {
        var li = document.createElement('li');
        li.className = 'public-queue-name public-active-name';
        li.textContent = validActive[i];
        ul.appendChild(li);
      }
      activeList.appendChild(ul);
    }

    var validUpNext = [];
    for (var i = 0; i < upNextNames.length; i++) {
      var name = String(upNextNames[i] || '').trim();
      if (name) validUpNext.push(name);
      if (validUpNext.length === 2) break; // Maximum 2
    }

    if (validUpNext.length === 0) {
      var p = document.createElement('p');
      p.textContent = "No eligible participants are currently previewed.";
      upNextList.appendChild(p);
    } else {
      var ol = document.createElement('ol');
      ol.className = 'public-queue-list';
      for (var i = 0; i < validUpNext.length; i++) {
        var li = document.createElement('li');
        li.className = 'public-queue-name public-up-next-name';
        var posSpan = document.createElement('span');
        posSpan.className = 'public-up-next-position';
        posSpan.textContent = (i + 1) + '. ';
        li.appendChild(posSpan);
        li.appendChild(document.createTextNode(validUpNext[i]));
        ol.appendChild(li);
      }
      upNextList.appendChild(ol);
    }
  }

  function renderPublicPhaseHeading(snapshot) {
    // We now render this info into the persistent top header instead of the main content area
    // The publicPhaseHeading is kept visibly hidden via CSS (.visually-hidden) for screen readers.

    if (!appState.participantId) {
        // Only update if guest; if logged in, main state syncs it
        if (snapshot.activeYear) {
            document.getElementById('activeYearLabel').innerText = snapshot.activeYear;
        }

        var phaseLabel = snapshot.phase || 'LOADING';
        if (phaseLabel === 'VACATION_SENIORITY') phaseLabel = 'VACATION SENIORITY';
        else if (phaseLabel === 'VACATION_RANDOM') phaseLabel = 'VACATION LOTTERY';
        else if (phaseLabel === 'WEEKEND') phaseLabel = 'WEEKEND COVERAGE';
        else if (phaseLabel === 'HOLIDAY_VOLUNTEER') phaseLabel = 'HOLIDAY VOLUNTEER';
        else if (phaseLabel === 'HOLIDAY_MANDATORY') phaseLabel = 'HOLIDAY MANDATORY';

        document.getElementById('phaseLabel').innerText = phaseLabel;

        var dirLabel = '';
        if (snapshot.direction === 'ASCENDING') dirLabel = ' (Forward)';
        else if (snapshot.direction === 'DESCENDING') dirLabel = ' (Reverse)';

        if (snapshot.round) {
            document.getElementById('roundLabel').innerText = 'R' + snapshot.round + dirLabel;
        } else {
            document.getElementById('roundLabel').innerText = '';
        }
    }
  }

  function formatPublicDate(val) {
    if (val === null || val === undefined || val === '' || val === 'null' || val === 'undefined') return '';
    var norm = normalizeDateKeyClient(val);
    if (!norm) return String(val);
    var parts = norm.split('-');
    try {
      var dateObj = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      return dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    } catch(e) {
      return norm;
    }
  }

  function createPublicItem(type, obj) {
    var item = document.createElement('div');
    item.className = 'public-calendar-item card'; // Note: card handles the box look, we will override pointer/hover in CSS

    // Store assigned names for highlighting
    item.setAttribute('data-assignees', (obj.assignedNames || []).map(function(n) { return n.trim().toLowerCase(); }).join('|'));

    // Store type and availability for filtering later
    item.setAttribute('data-type', type);
    item.setAttribute('data-remaining', obj.remainingCapacity);
    item.setAttribute('data-capacity', obj.capacity);

    var header = document.createElement('h4');
    header.className = 'public-calendar-heading';

    var subContent = document.createElement('div');
    subContent.className = 'badge-container';

    var availStatusClass = '';
    var availStr = '';

    if (type === 'VACATION') {
      if (obj.remainingCapacity >= 2) {
        availStatusClass = 'schedule-status-available';
        availStr = obj.remainingCapacity + ' spots available';
      } else if (obj.remainingCapacity === 1) {
        // Pale yellow availability for 1 spot remaining on multi-capacity
        availStatusClass = 'schedule-status-nearly-full';
        availStr = '1 spot available';
      } else {
        availStatusClass = 'schedule-status-full';
        availStr = 'Full';
      }
    } else {
      // WEEKEND or HOLIDAY
      if (obj.remainingCapacity > 0) {
        availStatusClass = 'schedule-status-available';
        availStr = 'Available';
      } else {
        availStatusClass = 'schedule-status-full';
        availStr = 'Full';
      }
    }

    item.classList.add(availStatusClass);

    if (type === 'VACATION') {
      header.textContent = formatPublicDate(obj.startDate);

      if (obj.primeClassification && obj.primeClassification.toLowerCase() === 'prime') {
         var pBadge = document.createElement('span');
         pBadge.className = 'badge badge-prime';
         pBadge.textContent = 'Prime';
         subContent.appendChild(pBadge);
      } else if (obj.primeClassification) {
         var npBadge = document.createElement('span');
         npBadge.className = 'badge badge-nonprime';
         npBadge.textContent = 'Non-Prime';
         subContent.appendChild(npBadge);
      }

      if (obj.specialWeekDesignation && obj.specialWeekDesignation !== 'None') {
         var sBadge = document.createElement('span');
         sBadge.className = 'badge badge-special';
         sBadge.textContent = obj.specialWeekDesignation;
         subContent.appendChild(sBadge);
      }
    } else if (type === 'WEEKEND') {
      header.textContent = obj.dayOfWeek + ' · ' + formatPublicDate(obj.date);
      // Vacation Adjacency Warnings are strictly private and not displayed on the public calendar
      if (obj.holidayProximityWarning) {
        var hBadge = document.createElement('div');
        hBadge.className = 'badge badge-warning';
        hBadge.textContent = obj.holidayProximityWarning;
        subContent.appendChild(hBadge);
      }
    } else if (type === 'HOLIDAY') {
      header.textContent = obj.holidayName + ' — ' + formatPublicDate(obj.observedDate) + ' · ' + obj.callPosition;
    }

    appendPublicSoftHolidayBadges_(
      subContent,
      obj.softHolidayWarnings
    );

    var avail = document.createElement('div');
    avail.className = 'public-availability card-subtitle';
    avail.textContent = availStr;

    var content = document.createElement('div');
    content.className = 'card-content';

    content.appendChild(header);
    if (subContent.hasChildNodes()) {
      content.appendChild(subContent);
    }
    content.appendChild(avail);

    if (obj.assignedNames && obj.assignedNames.length > 0) {
      var assigned = document.createElement('div');
      assigned.className = 'public-assigned-names assignees';
      for (var j = 0; j < obj.assignedNames.length; j++) {
        var p = document.createElement('span');
        p.className = 'assignee-pill';
        p.textContent = obj.assignedNames[j];
        assigned.appendChild(p);
      }
      content.appendChild(assigned);
    }

    item.appendChild(content);
    return item;
  }

  function populateMonthFilter(snapshot) {
     var monthSelect = document.getElementById('filterMonth');
     var currentVal = monthSelect.value;

     monthSelect.innerHTML = '<option value="ALL">All Months</option>';

     var cal = snapshot.calendar;
     if (!cal) return;

     var monthsMap = {};

     function addMonth(dateStr) {
        if (!dateStr) return;
        var norm = normalizeDateKeyClient(dateStr);
        if (!norm) return;
        var parts = norm.split('-');
        if (parts.length === 3) {
           var y = parseInt(parts[0], 10);
           var m = parseInt(parts[1], 10) - 1; // 0-indexed
           var dateObj = new Date(y, m, 1);
           var label = dateObj.toLocaleDateString(undefined, { month: 'short', year: 'numeric' });
           var key = y + '-' + String(m + 1).padStart(2, '0');
           monthsMap[key] = label;
        }
     }

     if (cal.vacationWeeks) {
        for (var i = 0; i < cal.vacationWeeks.length; i++) {
           addMonth(cal.vacationWeeks[i].startDate);
        }
     }
     if (cal.weekends) {
        for (var i = 0; i < cal.weekends.length; i++) {
           addMonth(cal.weekends[i].date);
        }
     }
     if (cal.holidays) {
        for (var i = 0; i < cal.holidays.length; i++) {
           addMonth(cal.holidays[i].observedDate);
        }
     }

     var keys = Object.keys(monthsMap).sort();
     for (var i = 0; i < keys.length; i++) {
        var opt = document.createElement('option');
        opt.value = keys[i];
        opt.textContent = monthsMap[keys[i]];
        monthSelect.appendChild(opt);
     }

     // Restore selection if it still exists
     if (currentVal && currentVal !== 'ALL' && monthsMap[currentVal]) {
        monthSelect.value = currentVal;
     } else {
        scheduleFilters.month = 'ALL';
     }
  }

  function renderPublicCalendar(snapshot) {
    var container = document.getElementById('publicCalendarContent');
    container.innerHTML = '';

    // Update timestamp
    var timestampEl = document.getElementById('scheduleLastUpdated');
    if (snapshot.generatedAt) {
       var d = new Date(snapshot.generatedAt);
       timestampEl.textContent = "Updated: " + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }

    var cal = snapshot.calendar;
    if (cal.supported === false) {
      var msg = document.createElement('p');
      msg.textContent = cal.unsupportedReason || "A calendar display is not available for the current phase.";
      container.appendChild(msg);
      applyFindPersonHighlights();
      return;
    }

    var showVacation = scheduleFilters.type === 'ALL' || scheduleFilters.type === 'VACATION';
    var showWeekends = scheduleFilters.type === 'ALL' || scheduleFilters.type === 'WEEKEND';
    var showHolidays = scheduleFilters.type === 'ALL' || scheduleFilters.type === 'HOLIDAY';

    // Helper to filter individual items
    function shouldShowItem(item, type) {
       // Availability
       var isAvail = type === 'VACATION' ? item.remainingCapacity >= 2 : item.remainingCapacity > 0;
       var isFull = item.remainingCapacity === 0;
       var isNearlyFull = type === 'VACATION' && item.remainingCapacity === 1;

       if (scheduleFilters.availability === 'AVAILABLE' && !isAvail) return false;
       if (scheduleFilters.availability === 'FULL' && !isFull) return false;
       if (scheduleFilters.availability === 'NEARLY_FULL' && !isNearlyFull) return false;

       // Month
       if (scheduleFilters.month !== 'ALL') {
          var dateStr = type === 'VACATION' ? item.startDate : (type === 'WEEKEND' ? item.date : item.observedDate);
          var norm = normalizeDateKeyClient(dateStr);
          if (norm) {
             var parts = norm.split('-');
             var monthKey = parts[0] + '-' + parts[1];
             if (monthKey !== scheduleFilters.month) return false;
          }
       }

       // Person
       if (scheduleFilters.person) {
          var searchVal = scheduleFilters.person.trim().toLowerCase();
          var assignees = (item.assignedNames || []).map(function(n) { return n.trim().toLowerCase(); });
          if (assignees.indexOf(searchVal) === -1) return false;
       }

       return true;
    }

    // Helper to render a section
    function renderSection(title, type, itemsRaw) {
       // Sort chronologically
       var items = itemsRaw.slice();
       items.sort(function(a, b) {
          var da = type === 'VACATION' ? a.startDate : (type === 'WEEKEND' ? a.date : a.observedDate);
          var db = type === 'VACATION' ? b.startDate : (type === 'WEEKEND' ? b.date : b.observedDate);

          var na = normalizeDateKeyClient(da) || da;
          var nb = normalizeDateKeyClient(db) || db;

          if (na < nb) return -1;
          if (na > nb) return 1;
          return 0;
       });

       var filteredItems = items.filter(function(i) { return shouldShowItem(i, type); });

       if (filteredItems.length === 0) return 0;

       if (scheduleFilters.type === 'ALL') {
          var head = document.createElement('h3');
          head.textContent = title;
          container.appendChild(head);
       }

       var grid = document.createElement('div');
       grid.className = 'public-calendar-grid';
       for (var i = 0; i < filteredItems.length; i++) {
          var el = createPublicItem(type, filteredItems[i]);

          // Apply person match outline if person filter active
          if (scheduleFilters.person) {
             el.classList.add('schedule-person-match');
          }
          grid.appendChild(el);
       }
       container.appendChild(grid);

       return filteredItems.length;
    }

    var totalShown = 0;

    if (showVacation) {
       totalShown += renderSection('Vacation Availability', 'VACATION', cal.vacationWeeks || []);
    }

    if (showWeekends) {
       totalShown += renderSection('Weekend Coverage', 'WEEKEND', cal.weekends || []);
    }

    if (showHolidays) {
       totalShown += renderSection('Holiday Coverage', 'HOLIDAY', cal.holidays || []);
    }

    if (totalShown === 0) {
       var emptyMsg = document.createElement('div');
       emptyMsg.className = 'text-muted';
       emptyMsg.style.padding = '24px';
       emptyMsg.style.textAlign = 'center';
       emptyMsg.style.border = '1px dashed var(--border)';
       emptyMsg.style.borderRadius = '8px';
       emptyMsg.textContent = "No schedule items match the current filters.";
       container.appendChild(emptyMsg);
    }

    applyFindPersonHighlights();
  }

  function populateFindPerson(names) {
    var select = document.getElementById('findPersonSelect');
    var loginSelect = document.getElementById('loginName');

    // Only populate options if empty (initial load)
    if (select.options.length <= 1) {
      select.innerHTML = '<option value="">Select a person</option>';
      for (var i = 0; i < names.length; i++) {
         var opt = document.createElement('option');
         opt.value = names[i];
         opt.textContent = names[i];
         select.appendChild(opt);
      }
    }

    if (loginSelect && loginSelect.options.length <= 1) {
      loginSelect.innerHTML = '<option value="">Select your name</option>';
      for (var i = 0; i < names.length; i++) {
         var opt = document.createElement('option');
         opt.value = names[i];
         opt.textContent = names[i];
         loginSelect.appendChild(opt);
      }
    }
  }

  function applyFindPersonHighlights() {
    // applyFindPersonHighlights is now mostly handled during render via `schedule-person-match`.
    // We only update the resultEl here based on what was rendered.
    var resultEl = document.getElementById('scheduleFilterResult');
    var searchVal = (scheduleFilters.person || '').trim();

    if (!searchVal) {
      var visibleItems = document.querySelectorAll('.public-calendar-item');
      resultEl.textContent = visibleItems.length + " items showing.";
      return;
    }

    var matchCount = document.querySelectorAll('.schedule-person-match').length;
    var visibleCount = document.querySelectorAll('.public-calendar-item').length;

    if (matchCount === 0) {
       resultEl.textContent = "0 assignments found for " + searchVal + " in the current view.";
    } else {
       resultEl.textContent = matchCount + " assignment" + (matchCount === 1 ? "" : "s") + " found for " + searchVal + " (" + visibleCount + " total items showing).";
    }
  }

</script>
