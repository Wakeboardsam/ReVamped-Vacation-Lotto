<style>
  :root {
    --primary: #3b82f6;
    --primary-dark: #2563eb;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --secondary: #64748b;
    --background: #f8fafc;
    --surface: #ffffff;
    --header-bg: #1e293b;
    --header-text: #f8fafc;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --accent: #0d9488;

    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  }

  * { box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  body { margin: 0; padding: 0; background-color: var(--background); color: var(--text-main); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

  /* Screens */
  .screen { display: none; }
  .screen.active { display: block; }

  /* Buttons */
  .btn { display: inline-block; padding: 10px 16px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; text-align: center; text-decoration: none; font-weight: 500; transition: all 0.2s ease; min-height: 44px; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-primary { background-color: var(--primary); color: white; }
  .btn-primary:not(:disabled):hover { background-color: var(--primary-dark); transform: translateY(-1px); }
  .btn-success { background-color: var(--success); color: white; }
  .btn-success:not(:disabled):hover { background-color: #059669; }
  .btn-danger { background-color: var(--danger); color: white; }
  .btn-danger:not(:disabled):hover { background-color: #dc2626; }
  .btn-secondary { background-color: var(--surface); color: var(--text-main); border: 1px solid var(--border); }
  .btn-secondary:not(:disabled):hover { background-color: #f1f5f9; }
  .btn-small { padding: 6px 12px; font-size: 14px; min-height: 36px; }

  /* Login */
  .login-container { max-width: 400px; margin: 40px auto; padding: 24px; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
  .login-container h2 { text-align: center; margin-top: 0; margin-bottom: 20px; color: var(--text-main); }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-main); font-size: 14px; }
  .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 16px; min-height: 44px; transition: border-color 0.2s; background: var(--surface); color: var(--text-main); }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
  .login-container .btn { width: 100%; font-weight: 600; }
  .error-text { color: var(--danger); margin-top: 12px; text-align: center; font-size: 14px; }

  /* Header */
  .app-header { background: var(--header-bg); color: var(--header-text); position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-md); display: flex; flex-direction: column; }
  .header-top { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; flex-wrap: wrap; gap: 12px; max-width: 1200px; margin: 0 auto; width: 100%; }
  .header-info { display: flex; gap: 16px; font-weight: 600; align-items: center; flex-wrap: wrap; }
  .header-actions { display: flex; gap: 12px; align-items: center; }
  .year-label { color: #94a3b8; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; }
  .phase-label { color: var(--surface); font-size: 18px; font-weight: 700; }
  .round-label { font-size: 14px; color: #cbd5e1; }

  /* Status Pill Badges */
  #statusBadgeContainer { display: flex; justify-content: center; width: 100%; background: #0f172a; border-top: 1px solid rgba(255,255,255,0.05); }
  .status-pill { display: flex; align-items: center; justify-content: center; padding: 8px 16px; font-size: 13px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; transition: all 0.3s ease; width: 100%; text-align: center; }
  .status-active { background-color: rgba(16, 185, 129, 0.15); color: #10b981; text-shadow: 0 0 8px rgba(16, 185, 129, 0.5); box-shadow: inset 0 0 10px rgba(16, 185, 129, 0.2); }
  .status-waiting { background-color: rgba(100, 116, 139, 0.15); color: #94a3b8; }
  .status-guest { background-color: rgba(255, 255, 255, 0.05); color: #cbd5e1; }

  /* Main Content */
  .app-content { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }

  /* Loading */
  .loading { text-align: center; padding: 48px; color: var(--text-muted); font-size: 18px; font-weight: 500; }

  /* Cards (Vacation/Weekend/Holiday Slots) */
  .card { background: var(--surface); border-radius: 12px; border: 1px solid var(--border); padding: 20px; display: flex; justify-content: space-between; align-items: flex-start; cursor: pointer; transition: all 0.2s ease; box-shadow: var(--shadow-sm); flex-direction: column; gap: 12px; margin-bottom: 0; }
  .card:hover:not(.disabled) { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: #cbd5e1; }

  /* Density control variables for cards */
  body.density-compact .card {
    padding: 12px;
    gap: 8px;
    border-radius: 10px;
  }
  body.density-compact .card-title {
    font-size: 16px;
    margin-bottom: 4px;
  }
  body.density-compact .card-subtitle {
    margin-bottom: 8px;
    font-size: 13px;
  }
  body.density-compact .badge-container {
    margin-bottom: 8px;
  }
  body.density-compact .assignees {
    font-size: 13px;
  }
  body.density-compact .assignee-pill {
    padding: 2px 6px;
    font-size: 12px;
  }

  body.density-subcompact .card {
    padding: 8px;
    gap: 4px;
    border-radius: 8px;
  }
  body.density-subcompact .card-title {
    font-size: 14px;
    margin-bottom: 4px;
  }
  body.density-subcompact .card-subtitle {
    margin-bottom: 6px;
    font-size: 12px;
  }
  body.density-subcompact .badge {
    padding: 2px 6px;
    font-size: 11px;
  }
  body.density-subcompact .badge-container {
    gap: 4px;
    margin-bottom: 6px;
  }
  body.density-subcompact .assignees {
    font-size: 12px;
    gap: 4px;
  }
  body.density-subcompact .assignee-pill {
    padding: 1px 4px;
    font-size: 11px;
  }

  /* Pale yellow availability for exactly 1 spot on multi-capacity */
  .card.schedule-status-nearly-full { background-color: #fef9c3; border-color: #fde047; }

  .card.selected { border: 2px solid var(--primary); background-color: #eff6ff; box-shadow: 0 0 0 1px var(--primary); }
  .card.disabled { opacity: 0.6; cursor: not-allowed; background-color: #f8fafc; pointer-events: none; }

  /* Proximity Card Styles (caution must be defined after positive to take precedence if both applied) */
  .card.card-proximity-positive { background-color: #f0fdf4; border-color: #bbf7d0; }
  .card.card-proximity-caution { background-color: #fef2f2; border-color: #fecaca; }

  /* Disabled/Selected take priority over proximity/yellow styling */
  .card.schedule-status-nearly-full.selected, .card.card-proximity-positive.selected, .card.card-proximity-caution.selected { border: 2px solid var(--primary); background-color: #eff6ff; box-shadow: 0 0 0 1px var(--primary); }
  .card.schedule-status-nearly-full.disabled, .card.card-proximity-positive.disabled, .card.card-proximity-caution.disabled { opacity: 0.6; cursor: not-allowed; background-color: #f8fafc; pointer-events: none; border-color: var(--border); }

  .card-content { flex: 1; width: 100%; }
  .card-title { font-size: 18px; font-weight: 700; margin: 0 0 8px 0; color: var(--text-main); }
  .card-subtitle { font-size: 14px; color: var(--text-muted); margin: 0 0 12px 0; }

  /* Badges inside Cards */
  .badge-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .badge { display: inline-flex; align-items: center; padding: 4px 10px; font-size: 12px; border-radius: 9999px; font-weight: 600; letter-spacing: 0.025em; }
  .badge-prime { background-color: #fef3c7; color: #d97706; border: 1px solid #fde68a; } /* Gold/Amber */
  .badge-nonprime { background-color: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }
  .badge-special { background-color: #ccfbf1; color: var(--accent); border: 1px solid #99f6e4; }
  .badge-warning { background-color: #fee2e2; color: #ef4444; border: 1px solid #fecaca; }
  .badge-info { background-color: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; }
  .badge-proximity-positive { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
  .badge-proximity-caution { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

  /* Capacity & Assigned Pills */
  .assignees { font-size: 14px; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .assignee-pill { display: inline-block; background: #f1f5f9; padding: 2px 8px; border-radius: 4px; font-size: 13px; font-weight: 500; border: 1px solid #e2e8f0; }
  .capacity-text { font-weight: 600; margin-right: 4px; }

  /* Grid Layouts */
  .weekend-grid, .holiday-grid, .transfer-grid, .vacation-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 16px;
  }

  body.density-compact .weekend-grid,
  body.density-compact .holiday-grid,
  body.density-compact .transfer-grid,
  body.density-compact .vacation-grid {
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
  }

  body.density-subcompact .weekend-grid,
  body.density-subcompact .holiday-grid,
  body.density-subcompact .transfer-grid,
  body.density-subcompact .vacation-grid {
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 8px;
  }

  /* Action Bar */
  .action-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 16px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -4px 6px -1px rgba(0,0,0,0.05); z-index: 90; }
  #selectionSummary { font-weight: 600; font-size: 16px; color: var(--text-main); }
  .action-bar-inner { max-width: 1200px; margin: 0 auto; display: flex; width: 100%; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;}
  .action-buttons { display: flex; gap: 12px; }
  .action-bar .btn { min-width: 120px; }
  body { padding-bottom: 90px; }

  /* Modals (Backdrop-blurred card overlay) */
  .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 200; padding: 20px; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
  .modal[style*="display: flex"] { opacity: 1; visibility: visible; }
  .modal-content { background: var(--surface); padding: 32px; border-radius: 16px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); border: 1px solid var(--border); transform: translateY(20px); transition: transform 0.3s ease; }
  .modal[style*="display: flex"] .modal-content { transform: translateY(0); }
  .modal-content h3 { margin-top: 0; font-size: 20px; font-weight: 700; margin-bottom: 16px; color: var(--text-main); }
  .modal-content p { color: var(--text-muted); margin-bottom: 24px; line-height: 1.6; }
  .modal-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 32px; }
  @media(min-width: 480px) { .modal-actions { flex-direction: row; justify-content: flex-end; } }

  /* Segmented Pill-Button Toggles */
  .segmented-control { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  .segmented-control-label { font-weight: 600; font-size: 14px; margin-bottom: 4px; color: var(--text-main); }
  .segmented-group { display: flex; background: #f1f5f9; border-radius: 8px; padding: 4px; gap: 4px; flex-wrap: wrap; }
  .segmented-item { flex: 1; min-width: 80px; position: relative; }
  .segmented-item input[type="radio"] { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; z-index: 2; margin: 0; }
  .segmented-label { display: block; text-align: center; padding: 10px 8px; font-size: 14px; font-weight: 500; color: var(--text-muted); border-radius: 6px; transition: all 0.2s; z-index: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; }
  .segmented-item input[type="radio"]:checked + .segmented-label { background: var(--surface); color: var(--primary-dark); box-shadow: var(--shadow-sm); font-weight: 600; }
  .segmented-item input[type="radio"]:focus-visible + .segmented-label { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* Radio Options (for standard choices like holidays) */
  .radio-option { display: flex; align-items: center; padding: 16px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; }
  .radio-option:hover { background-color: #f8fafc; border-color: #cbd5e1; }
  .radio-option input[type="radio"] { margin-right: 12px; width: 18px; height: 18px; accent-color: var(--primary); }

  /* Toasts */
  .toast-container { position: fixed; top: 24px; right: 24px; z-index: 300; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
  .toast { padding: 14px 24px; border-radius: 8px; color: white; font-weight: 500; font-size: 14px; box-shadow: var(--shadow-md); animation: fadein 0.3s, fadeout 0.3s 4.7s forwards; display: flex; align-items: center; }
  .toast.error { background-color: var(--danger); }
  .toast.success { background-color: var(--success); }

  @keyframes fadein { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes fadeout { from { opacity: 1; } to { opacity: 0; } }

  /* Public Display */
  .public-display { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
  .public-queue { margin-bottom: 40px; }
  .public-queue h3 { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: var(--text-main); }
  .public-queue-grid { display: flex; flex-direction: column; gap: 20px; }

  .public-active-panel, .public-up-next-panel { border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: var(--shadow-sm); }
  .public-active-panel h4, .public-up-next-panel h4 { margin-top: 0; margin-bottom: 8px; font-size: 18px; font-weight: 700; }
  .public-active-panel { border-color: #a7f3d0; background-color: #ecfdf5; }
  .public-active-panel h4 { color: #065f46; }
  .public-up-next-panel { background-color: var(--surface); }

  .public-queue-help { font-size: 14px; color: var(--text-muted); margin-top: 0; margin-bottom: 16px; }
  .public-queue-list { margin: 0; padding: 0; list-style-type: none; display: flex; flex-direction: column; gap: 8px; }
  .public-active-name, .public-up-next-name { font-size: 16px; overflow-wrap: anywhere; min-width: 0; padding-left: 0; }
  .public-active-name { font-weight: 700; color: #065f46; font-size: 18px; }
  .public-up-next-position { font-weight: 700; color: var(--secondary); margin-right: 8px; }

  @media(min-width: 768px) { .public-queue-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }

  .login-explanation { text-align: center; color: var(--text-muted); margin-bottom: 24px; font-size: 15px; }

  .find-person-controls { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; background: var(--surface); padding: 16px; border-radius: 8px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
  .find-person-controls label { font-weight: 600; font-size: 14px; }
  .find-person-controls select { padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 15px; flex: 1; min-width: 200px; min-height: 44px; }

  #findPersonResult { margin-bottom: 24px; font-size: 14px; color: var(--text-muted); min-height: 20px; font-weight: 500; }

  .public-calendar-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 40px; }

  body.density-compact .public-calendar-grid {
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
  }

  body.density-subcompact .public-calendar-grid {
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 8px;
  }

  /* Override card cursor and hover for public items */
  .public-calendar-item { cursor: default; border: 1px solid var(--border); }
  .public-calendar-item:hover { box-shadow: var(--shadow-sm); transform: none; border-color: var(--border); }
  .public-calendar-heading { font-size: 16px; font-weight: 700; margin: 0 0 12px 0; color: var(--text-main); }
  .public-availability { font-size: 14px; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; }

  /* Schedule Filters */
  .schedule-filters { display: flex; flex-wrap: wrap; gap: 16px; background: var(--surface); padding: 16px; border-radius: 8px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); margin-bottom: 24px; align-items: flex-end; }
  .filter-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 140px; }
  .filter-group label { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .filter-group select { padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 15px; width: 100%; min-height: 44px; background-color: var(--surface); color: var(--text-main); }
  .filter-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
  .filter-actions .btn { min-height: 44px; }
  .filter-actions button[aria-pressed="true"] { background-color: #eff6ff; color: var(--primary-dark); border-color: var(--primary); box-shadow: var(--shadow-sm); }

  .schedule-status-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .text-sm { font-size: 14px; }
  .text-muted { color: var(--text-muted); }

  .schedule-legend { display: flex; gap: 16px; margin-bottom: 24px; font-size: 14px; font-weight: 500; color: var(--text-muted); flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .legend-color { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--border); }
  .legend-available { background-color: #ffffff; }
  .legend-nearly-full { background-color: #fef9c3; border-color: #fde047; }
  .legend-full { background-color: #fee2e2; border-color: #fecaca; }

  /* Schedule Read-Only Status Classes */
  .public-calendar-item.schedule-status-available { background-color: #ffffff; }
  .public-calendar-item.schedule-status-nearly-full { background-color: #fef9c3; border-color: #fde047; }
  .public-calendar-item.schedule-status-full { background-color: #fee2e2; border-color: #fecaca; }

  /* Schedule Specific Highlight state for Find Person (Outline only, don't override background) */
  .schedule-person-match { border: 2px solid var(--primary) !important; box-shadow: 0 0 0 1px var(--primary) !important; position: relative; }

  /* Hidden helper classes for headings */
  .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0; }
</style>
