name: Deploy to Google Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Generate .clasprc.json authentication file
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Update .clasp.json with Script ID
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          if [ -z "$SCRIPT_ID" ]; then
            echo "Error: SCRIPT_ID secret is empty or undefined."
            exit 1
          fi
          # Create a new .clasp.json using node so we do structural substitution securely
          node -e "const fs = require('fs'); const config = JSON.parse(fs.readFileSync('.clasp.json', 'utf8')); config.scriptId = process.env.SCRIPT_ID; fs.writeFileSync('.clasp.json', JSON.stringify(config, null, 2));"

      - name: Run Tests
        run: npm test

      - name: Push Code to Google Apps Script
        run: clasp push --force
